<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="360" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<title>Crack spread hedge mechanics</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="26" text-anchor="middle" fill="#2C2C2A">Hedging the crack spread</text>
<text class="ts" x="340" y="44" text-anchor="middle" fill="#5F5E5A">Offset the physical exposure with an equal and opposite futures position</text>
<text class="th" x="175" y="78" text-anchor="middle" fill="#2C2C2A">Physical exposure</text>
<text class="th" x="505" y="78" text-anchor="middle" fill="#2C2C2A">Futures hedge</text>
<g class="c-coral"><rect x="50" y="92" width="250" height="52" rx="8" stroke-width="0.5"/><text class="th" x="175" y="112" text-anchor="middle">Buys crude to run</text><text class="ts" x="175" y="130" text-anchor="middle">exposed if crude rises</text></g>
<g class="c-teal"><rect x="380" y="92" width="250" height="52" rx="8" stroke-width="0.5"/><text class="th" x="505" y="112" text-anchor="middle">Long 3 crude futures</text><text class="ts" x="505" y="130" text-anchor="middle">gains if crude rises</text></g>
<line x1="302" y1="118" x2="376" y2="118" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<g class="c-coral"><rect x="50" y="160" width="250" height="52" rx="8" stroke-width="0.5"/><text class="th" x="175" y="180" text-anchor="middle">Sells products later</text><text class="ts" x="175" y="198" text-anchor="middle">exposed if products fall</text></g>
<g class="c-teal"><rect x="380" y="160" width="250" height="52" rx="8" stroke-width="0.5"/><text class="th" x="505" y="180" text-anchor="middle">Short 2 RBOB + 1 ULSD</text><text class="ts" x="505" y="198" text-anchor="middle">gains if products fall</text></g>
<line x1="302" y1="186" x2="376" y2="186" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="340" y1="216" x2="340" y2="240" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-blue"><rect x="130" y="242" width="420" height="58" rx="8" stroke-width="0.5"/><text class="th" x="340" y="266" text-anchor="middle">Margin locked in</text><text class="ts" x="340" y="286" text-anchor="middle">Absolute price moves cancel — only the spread matters</text></g>
<text class="ts" x="340" y="328" text-anchor="middle" fill="#5F5E5A">CME lists packaged crack spread futures so all three legs trade as one instrument</text>
</svg>