<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Central Cushing hub -->
<g class="node c-amber" onclick="sendPrompt('Explain Cushing Oklahoma in detail — who owns the tanks, how does trading work, what happens at expiry?')">
  <rect x="256" y="150" width="168" height="100" rx="12" stroke-width="0.8"/>
  <text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central">Cushing, OK</text>
  <text class="ts" x="340" y="198" text-anchor="middle" dominant-baseline="central">~90 MMbbl capacity</text>
  <text class="ts" x="340" y="214" text-anchor="middle" dominant-baseline="central">400+ storage tanks</text>
  <text class="ts" x="340" y="230" text-anchor="middle" dominant-baseline="central">WTI NYMEX delivery point</text>
</g>

<!-- Inbound pipelines (left side) -->
<g class="node c-gray" onclick="sendPrompt('Which pipelines bring crude into Cushing from the Permian Basin?')">
  <rect x="30" y="60" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="95" y="79" text-anchor="middle" dominant-baseline="central">Permian Basin</text>
  <text class="ts" x="95" y="95" text-anchor="middle" dominant-baseline="central">Cactus II, Gray Oak</text>
</g>
<line x1="160" y1="82" x2="254" y2="185" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-gray" onclick="sendPrompt('Which pipelines bring Bakken crude into Cushing?')">
  <rect x="30" y="158" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="95" y="177" text-anchor="middle" dominant-baseline="central">Bakken (DAPL)</text>
  <text class="ts" x="95" y="193" text-anchor="middle" dominant-baseline="central">Dakota Access Pipeline</text>
</g>
<line x1="160" y1="180" x2="254" y2="196" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-gray" onclick="sendPrompt('How does Canadian crude reach Cushing through the Enbridge and Keystone systems?')">
  <rect x="30" y="256" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="95" y="275" text-anchor="middle" dominant-baseline="central">Canada (Enbridge)</text>
  <text class="ts" x="95" y="291" text-anchor="middle" dominant-baseline="central">Mainline → Flanagan</text>
</g>
<line x1="160" y1="278" x2="254" y2="222" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Outbound pipelines (right side) -->
<g class="node c-blue" onclick="sendPrompt('Which pipelines carry crude from Cushing to Gulf Coast refineries?')">
  <rect x="520" y="60" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="585" y="79" text-anchor="middle" dominant-baseline="central">Gulf Coast refining</text>
  <text class="ts" x="585" y="95" text-anchor="middle" dominant-baseline="central">Seaway, Longhorn, BridgeTex</text>
</g>
<line x1="424" y1="185" x2="518" y2="82" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-blue" onclick="sendPrompt('How does crude move from Cushing to Midwest refineries?')">
  <rect x="520" y="158" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="585" y="177" text-anchor="middle" dominant-baseline="central">Midwest refining</text>
  <text class="ts" x="585" y="193" text-anchor="middle" dominant-baseline="central">Capline, Patoka, Wood River</text>
</g>
<line x1="424" y1="200" x2="518" y2="180" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-blue" onclick="sendPrompt('What is the Magellan East Houston terminal and how does crude get from Cushing to export?')">
  <rect x="520" y="256" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="585" y="275" text-anchor="middle" dominant-baseline="central">Export terminals</text>
  <text class="ts" x="585" y="291" text-anchor="middle" dominant-baseline="central">MEH, Corpus Christi</text>
</g>
<line x1="424" y1="218" x2="518" y2="278" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Tank farm illustration -->
<text class="ts" x="340" y="360" text-anchor="middle" fill="#5F5E5A" font-size="10">Tank farm (illustrative — 400+ floating-roof tanks across ~1,000 acres)</text>
<circle cx="220" cy="350" r="14" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<circle cx="256" cy="350" r="14" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<circle cx="292" cy="350" r="14" fill="#EF9F27" opacity="0.6" stroke="#BA7517" stroke-width="1"/>
<circle cx="328" cy="350" r="14" fill="#EF9F27" opacity="0.6" stroke="#BA7517" stroke-width="1"/>
<circle cx="364" cy="350" r="14" fill="#EF9F27" opacity="0.8" stroke="#BA7517" stroke-width="1"/>
<circle cx="400" cy="350" r="14" fill="#EF9F27" opacity="0.8" stroke="#BA7517" stroke-width="1"/>
<circle cx="436" cy="350" r="14" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<circle cx="472" cy="350" r="14" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text class="ts" x="220" y="383" text-anchor="middle" fill="#633806" font-size="9">Plains</text>
<text class="ts" x="274" y="383" text-anchor="middle" fill="#633806" font-size="9">Enbridge</text>
<text class="ts" x="346" y="383" text-anchor="middle" fill="#633806" font-size="9">Magellan/ONEOK</text>
<text class="ts" x="454" y="383" text-anchor="middle" fill="#633806" font-size="9">Mewbourne</text>

<!-- Futures delivery mechanics -->
<rect x="30" y="336" width="174" height="88" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="117" y="354" text-anchor="middle" font-size="11">WTI futures delivery</text>
<text class="ts" x="44" y="372" font-size="10">Contract: 1,000 bbl per lot</text>
<text class="ts" x="44" y="388" font-size="10">Delivery: pipeline or tank</text>
<text class="ts" x="44" y="404" font-size="10">at Cushing, OK</text>
<text class="ts" x="44" y="420" font-size="10">Expiry: ~20th of prior month</text>

<!-- Contango / backwardation -->
<rect x="476" y="336" width="174" height="88" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="563" y="354" text-anchor="middle" font-size="11">Storage signal</text>
<text class="ts" x="490" y="372" font-size="10">High inventory → contango</text>
<text class="ts" x="490" y="388" font-size="10">(futures > spot — cost of</text>
<text class="ts" x="490" y="404" font-size="10">carry drives curve shape)</text>
<text class="ts" x="490" y="420" font-size="10">Low inventory → backwardation</text>
</svg>