<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- SURFACE - derrick -->
<rect x="148" y="10" width="4" height="180" fill="#444441"/>
<rect x="228" y="10" width="4" height="180" fill="#444441"/>
<line x1="148" y1="10" x2="230" y2="10" stroke="#444441" stroke-width="3"/>
<line x1="152" y1="60" x2="228" y2="60" stroke="#444441" stroke-width="1.5"/>
<line x1="152" y1="110" x2="228" y2="110" stroke="#444441" stroke-width="1.5"/>
<line x1="152" y1="160" x2="228" y2="160" stroke="#444441" stroke-width="1.5"/>
<text class="ts" x="190" y="8" text-anchor="middle" fill="#5F5E5A" font-size="10">Derrick</text>

<!-- Mud pits, pumps, surface equipment -->
<rect x="30" y="180" width="320" height="30" rx="4" fill="#888780" opacity="0.4"/>
<text class="ts" x="190" y="200" text-anchor="middle" fill="#2C2C2A" font-size="10">Surface — BOP stack · Mud pumps · Shale shakers · Mud pits</text>

<!-- Ground line -->
<rect x="30" y="210" width="320" height="6" fill="#6a9a58"/>
<text class="ts" x="20" y="218" text-anchor="start" fill="#173404" font-size="10">Surface</text>

<!-- Casing schematic (nested tubes) -->
<!-- Conductor casing (outermost) -->
<rect x="155" y="216" width="70" height="120" rx="4" fill="none" stroke="#888780" stroke-width="6"/>
<text class="ts" x="96" y="260" text-anchor="end" fill="#5F5E5A" font-size="10">Conductor</text>
<text class="ts" x="96" y="272" text-anchor="end" fill="#5F5E5A" font-size="10">casing</text>
<line x1="98" y1="266" x2="155" y2="260" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>

<!-- Surface casing -->
<rect x="163" y="216" width="54" height="200" rx="3" fill="none" stroke="#BA7517" stroke-width="4"/>
<text class="ts" x="96" y="310" text-anchor="end" fill="#BA7517" font-size="10">Surface</text>
<text class="ts" x="96" y="322" text-anchor="end" fill="#BA7517" font-size="10">casing</text>
<line x1="98" y1="316" x2="163" y2="316" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="3 2"/>

<!-- Intermediate casing -->
<rect x="169" y="216" width="42" height="290" rx="2" fill="none" stroke="#185FA5" stroke-width="3"/>
<text class="ts" x="96" y="370" text-anchor="end" fill="#185FA5" font-size="10">Intermediate</text>
<text class="ts" x="96" y="382" text-anchor="end" fill="#185FA5" font-size="10">casing</text>
<line x1="98" y1="376" x2="169" y2="376" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 2"/>

<!-- Production casing (innermost) -->
<rect x="174" y="216" width="32" height="360" rx="2" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
<text class="ts" x="96" y="430" text-anchor="end" fill="#1D9E75" font-size="10">Production</text>
<text class="ts" x="96" y="442" text-anchor="end" fill="#1D9E75" font-size="10">casing</text>
<line x1="98" y1="436" x2="174" y2="436" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="3 2"/>

<!-- Cement fill between casings -->
<rect x="155" y="286" width="8" height="50" fill="#c8c1a8" opacity="0.7"/>
<rect x="233" y="286" width="8" height="50" fill="#c8c1a8" opacity="0.7"/>
<text class="ts" x="260" y="320" fill="#5F5E5A" font-size="9">cement</text>

<!-- Drill string inside -->
<rect x="182" y="216" width="16" height="340" rx="2" fill="#444441" opacity="0.6"/>
<text class="ts" x="260" y="250" fill="#5F5E5A" font-size="10">Drill pipe</text>
<line x1="258" y1="246" x2="198" y2="240" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>

<!-- Mud flow arrows: down inside drill pipe -->
<line x1="190" y1="230" x2="190" y2="280" class="arr" stroke="#5ba3cc" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="190" y1="295" x2="190" y2="350" class="arr" stroke="#5ba3cc" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="260" y="290" fill="#185FA5" font-size="9">Mud flows</text>
<text class="ts" x="260" y="301" fill="#185FA5" font-size="9">down inside</text>
<line x1="258" y1="288" x2="200" y2="290" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 2"/>

<!-- Mud returns up annulus -->
<line x1="172" y1="370" x2="172" y2="320" class="arr" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="96" y="345" text-anchor="end" fill="#1D9E75" font-size="9">Returns up</text>
<text class="ts" x="96" y="356" text-anchor="end" fill="#1D9E75" font-size="9">annulus</text>

<!-- BHA section -->
<rect x="178" y="554" width="24" height="20" rx="3" fill="#444441"/>
<text class="ts" x="260" y="520" fill="#5F5E5A" font-size="10">BHA (bottom-hole</text>
<text class="ts" x="260" y="532" fill="#5F5E5A" font-size="10">assembly): MWD +</text>
<text class="ts" x="260" y="544" fill="#5F5E5A" font-size="10">LWD + drill collars</text>
<line x1="258" y1="533" x2="202" y2="550" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>

<!-- Drill bit -->
<polygon points="185,574 175,560 190,560 180,574 190,574 180,560 195,560" fill="#E8593C"/>
<text class="ts" x="260" y="568" fill="#E8593C" font-size="10">Tri-cone or PDC bit</text>
<line x1="258" y1="567" x2="208" y2="568" stroke="#E8593C" stroke-width="0.5" stroke-dasharray="3 2"/>

<!-- Formation layers right side -->
<rect x="370" y="210" width="280" height="350" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="th" x="510" y="232" text-anchor="middle" font-size="12">Casing program — why nested?</text>
<text class="ts" x="385" y="256" font-size="11">Each casing string is set at a depth that isolates</text>
<text class="ts" x="385" y="272" font-size="11">a pressure or geological hazard zone:</text>

<rect x="385" y="284" width="255" height="38" rx="4" fill="#888780" opacity="0.25"/>
<text class="th" x="512" y="300" text-anchor="middle" font-size="11">Conductor (30–50 ft)</text>
<text class="ts" x="512" y="316" text-anchor="middle" font-size="10">Structural — prevents borehole collapse near surface</text>

<rect x="385" y="328" width="255" height="38" rx="4" fill="#BA7517" opacity="0.2"/>
<text class="th" x="512" y="344" text-anchor="middle" font-size="11">Surface casing (300–2,000 ft)</text>
<text class="ts" x="512" y="360" text-anchor="middle" font-size="10">Protects freshwater aquifers — legally required</text>

<rect x="385" y="372" width="255" height="38" rx="4" fill="#185FA5" opacity="0.2"/>
<text class="th" x="512" y="388" text-anchor="middle" font-size="11">Intermediate casing</text>
<text class="ts" x="512" y="404" text-anchor="middle" font-size="10">Isolates unstable shales, high-pressure zones</text>

<rect x="385" y="416" width="255" height="38" rx="4" fill="#1D9E75" opacity="0.2"/>
<text class="th" x="512" y="432" text-anchor="middle" font-size="11">Production casing</text>
<text class="ts" x="512" y="448" text-anchor="middle" font-size="10">Lines the reservoir interval — perforated for flow</text>

<text class="ts" x="385" y="476" font-size="10">After each casing string: cement is pumped down</text>
<text class="ts" x="385" y="490" font-size="10">inside, then up the annulus to seal it in place.</text>
<text class="ts" x="385" y="506" font-size="10">Integrity is pressure-tested before drilling ahead.</text>
<text class="ts" x="385" y="522" font-size="10">BOP (blowout preventer) sits on the wellhead —</text>
<text class="ts" x="385" y="538" font-size="10">hydraulic rams can seal or shear the drill pipe</text>
<text class="ts" x="385" y="554" font-size="10">to prevent a blowout if pressure control is lost.</text>
</svg>