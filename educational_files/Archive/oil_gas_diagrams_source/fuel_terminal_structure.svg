<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="470" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<title>Fuel distribution terminal structure</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="140" y="30" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="240" y="48" text-anchor="middle">Pipeline receipt</text><text class="ts" x="240" y="66" text-anchor="middle">Batched products</text></g>
<g class="c-gray"><rect x="380" y="30" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="480" y="48" text-anchor="middle">Barge / rail receipt</text><text class="ts" x="480" y="66" text-anchor="middle">Alternate delivery</text></g>
<line x1="240" y1="86" x2="300" y2="104" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<line x1="480" y1="86" x2="380" y2="104" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-gray"><rect x="240" y="104" width="200" height="40" rx="8" stroke-width="0.5"/><text class="th" x="340" y="124" text-anchor="middle" dominant-baseline="central">Receiving manifold</text></g>
<line x1="300" y1="144" x2="100" y2="178" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="330" y1="144" x2="260" y2="178" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="350" y1="144" x2="420" y2="178" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="380" y1="144" x2="580" y2="178" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<g class="c-blue"><rect x="25" y="180" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="198" text-anchor="middle">Gasoline</text><text class="ts" x="100" y="216" text-anchor="middle">base, unbranded</text></g>
<g class="c-blue"><rect x="185" y="180" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="260" y="198" text-anchor="middle">Diesel</text><text class="ts" x="260" y="216" text-anchor="middle">ULSD, dyed diesel</text></g>
<g class="c-blue"><rect x="345" y="180" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="420" y="198" text-anchor="middle">Jet Fuel</text><text class="ts" x="420" y="216" text-anchor="middle">Jointly stored</text></g>
<g class="c-amber"><rect x="505" y="180" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="580" y="198" text-anchor="middle">Ethanol</text><text class="ts" x="580" y="216" text-anchor="middle">Blended at rack</text></g>
<line x1="100" y1="236" x2="300" y2="298" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="260" y1="236" x2="330" y2="298" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="420" y1="236" x2="350" y2="298" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="580" y1="236" x2="380" y2="298" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<g class="c-coral"><rect x="190" y="300" width="300" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="324" text-anchor="middle">Truck loading rack</text><text class="ts" x="340" y="346" text-anchor="middle">Metering, additives, vapor capture</text></g>
<line x1="340" y1="364" x2="340" y2="384" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-teal"><rect x="190" y="384" width="300" height="48" rx="8" stroke-width="0.5"/><text class="th" x="340" y="402" text-anchor="middle">Retail stations</text><text class="ts" x="340" y="420" text-anchor="middle">&amp; industrial customers</text></g>
<text class="ts" x="340" y="454" text-anchor="middle" fill="#5F5E5A">~100–150 mile truck delivery radius before another terminal is needed</text>
</svg>