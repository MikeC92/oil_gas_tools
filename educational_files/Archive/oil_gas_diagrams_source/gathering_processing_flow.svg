<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- WELLHEADS (left column) -->
<g class="node c-amber" onclick="sendPrompt('What does raw wellhead production look like — what is in it before processing?')">
  <rect x="20" y="60" width="110" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="75" y="78" text-anchor="middle" dominant-baseline="central">Well A</text>
  <text class="ts" x="75" y="94" text-anchor="middle" dominant-baseline="central">raw production</text>
</g>
<g class="node c-amber" onclick="sendPrompt('What does raw wellhead production look like — what is in it before processing?')">
  <rect x="20" y="128" width="110" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="75" y="146" text-anchor="middle" dominant-baseline="central">Well B</text>
  <text class="ts" x="75" y="162" text-anchor="middle" dominant-baseline="central">raw production</text>
</g>
<g class="node c-amber" onclick="sendPrompt('What does raw wellhead production look like — what is in it before processing?')">
  <rect x="20" y="196" width="110" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="75" y="214" text-anchor="middle" dominant-baseline="central">Well C</text>
  <text class="ts" x="75" y="230" text-anchor="middle" dominant-baseline="central">raw production</text>
</g>
<g class="node c-amber" onclick="sendPrompt('What does raw wellhead production look like — what is in it before processing?')">
  <rect x="20" y="264" width="110" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="75" y="282" text-anchor="middle" dominant-baseline="central">Well D</text>
  <text class="ts" x="75" y="298" text-anchor="middle" dominant-baseline="central">raw production</text>
</g>

<!-- Gathering lines to header -->
<line x1="130" y1="82" x2="168" y2="180" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="130" y1="150" x2="168" y2="183" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="130" y1="218" x2="168" y2="186" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="130" y1="286" x2="168" y2="188" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- FIELD SEPARATOR / HEADER -->
<g class="node c-gray" onclick="sendPrompt('What happens at a field separator — how does three-phase separation work?')">
  <rect x="170" y="148" width="118" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="229" y="176" text-anchor="middle" dominant-baseline="central">Field separator</text>
  <text class="ts" x="229" y="196" text-anchor="middle" dominant-baseline="central">3-phase: oil/gas/water</text>
  <text class="ts" x="229" y="212" text-anchor="middle" dominant-baseline="central">gravity separation</text>
</g>

<!-- Water disposal (down) -->
<line x1="229" y1="228" x2="229" y2="268" stroke="#5ba3cc" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="node c-blue" onclick="sendPrompt('Where does produced water go from field separators?')">
  <rect x="170" y="270" width="118" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="229" y="288" text-anchor="middle" dominant-baseline="central">Produced water</text>
  <text class="ts" x="229" y="304" text-anchor="middle" dominant-baseline="central">SWD injection well</text>
</g>

<!-- Crude out (down-right) -->
<line x1="288" y1="208" x2="332" y2="340" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="node c-amber" onclick="sendPrompt('How does crude oil get stabilized at a lease automatic custody transfer unit?')">
  <rect x="290" y="342" width="130" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="355" y="362" text-anchor="middle" dominant-baseline="central">Crude stabilizer</text>
  <text class="ts" x="355" y="378" text-anchor="middle" dominant-baseline="central">flash light ends</text>
  <text class="ts" x="355" y="392" text-anchor="middle" dominant-baseline="central">LACT unit + custody</text>
</g>

<!-- Crude to pipeline -->
<line x1="420" y1="370" x2="468" y2="370" stroke="#BA7517" stroke-width="1.8" marker-end="url(#arrow)"/>
<g class="node c-amber" onclick="sendPrompt('Where does gathered crude oil go after the lease automatic custody transfer?')">
  <rect x="470" y="348" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="535" y="366" text-anchor="middle" dominant-baseline="central">Crude pipeline</text>
  <text class="ts" x="535" y="382" text-anchor="middle" dominant-baseline="central">to trunk system</text>
</g>

<!-- Raw gas to compression -->
<line x1="288" y1="175" x2="332" y2="175" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="node c-blue" onclick="sendPrompt('What do compression stations do in a gathering system — why is compression needed?')">
  <rect x="334" y="148" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="394" y="168" text-anchor="middle" dominant-baseline="central">Compression</text>
  <text class="ts" x="394" y="184" text-anchor="middle" dominant-baseline="central">boost pressure for</text>
  <text class="ts" x="394" y="198" text-anchor="middle" dominant-baseline="central">plant inlet</text>
</g>

<!-- Gas to plant -->
<line x1="454" y1="175" x2="494" y2="175" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- GAS PROCESSING PLANT (right, large) -->
<g class="node c-blue" onclick="sendPrompt('Walk me through what happens inside a cryogenic gas processing plant')">
  <rect x="496" y="60" width="158" height="280" rx="10" stroke-width="0.5"/>
  <text class="th" x="575" y="88" text-anchor="middle" dominant-baseline="central">Gas processing</text>
  <text class="th" x="575" y="106" text-anchor="middle" dominant-baseline="central">plant</text>

  <!-- Internal steps -->
  <rect x="510" y="120" width="130" height="30" rx="4" stroke-width="0.3"/>
  <text class="ts" x="575" y="139" text-anchor="middle" dominant-baseline="central">Inlet separation</text>

  <rect x="510" y="158" width="130" height="30" rx="4" stroke-width="0.3"/>
  <text class="ts" x="575" y="177" text-anchor="middle" dominant-baseline="central">Amine treating (H2S/CO2)</text>

  <rect x="510" y="196" width="130" height="30" rx="4" stroke-width="0.3"/>
  <text class="ts" x="575" y="215" text-anchor="middle" dominant-baseline="central">Dehydration (TEG)</text>

  <rect x="510" y="234" width="130" height="30" rx="4" stroke-width="0.3"/>
  <text class="ts" x="575" y="253" text-anchor="middle" dominant-baseline="central">NGL extraction (cryo)</text>

  <rect x="510" y="272" width="130" height="30" rx="4" stroke-width="0.3"/>
  <text class="ts" x="575" y="291" text-anchor="middle" dominant-baseline="central">Demethanizer</text>
</g>

<!-- Residue gas out (top right) -->
<line x1="575" y1="60" x2="575" y2="28" stroke="#185FA5" stroke-width="1.8" marker-end="url(#arrow)"/>
<g class="node c-blue" onclick="sendPrompt('What is residue gas and where does it go after the gas processing plant?')">
  <rect x="496" y="8" width="158" height="18" rx="4" stroke-width="0.5"/>
  <text class="ts" x="575" y="21" text-anchor="middle" dominant-baseline="central">Residue gas → interstate pipeline (95%+ methane)</text>
</g>

<!-- NGL out (bottom right of plant) -->
<line x1="575" y1="340" x2="575" y2="378" stroke="#1D9E75" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- NGL FRACTIONATION -->
<g class="node c-teal" onclick="sendPrompt('What is NGL fractionation and how does the deethanizer, depropanizer, debutanizer sequence work?')">
  <rect x="496" y="380" width="158" height="130" rx="10" stroke-width="0.5"/>
  <text class="th" x="575" y="402" text-anchor="middle" dominant-baseline="central">NGL fractionation</text>
  <text class="ts" x="575" y="420" text-anchor="middle" dominant-baseline="central">(Mont Belvieu)</text>
  <text class="ts" x="510" y="442" font-size="10">Ethane (C2) → crackers</text>
  <text class="ts" x="510" y="458" font-size="10">Propane (C3) → heating/ag</text>
  <text class="ts" x="510" y="474" font-size="10">Butane (C4) → blend/chem</text>
  <text class="ts" x="510" y="490" font-size="10">Nat. gasoline (C5+) → refinery</text>
</g>

<!-- Legend / label for gathering lines -->
<rect x="20" y="336" width="240" height="90" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="140" y="356" text-anchor="middle" font-size="11">Wellhead raw stream composition</text>
<text class="ts" x="34" y="374" font-size="10">Methane (C1): 70–95% of gas volume</text>
<text class="ts" x="34" y="390" font-size="10">NGLs (C2–C5+): 5–30% (wet gas wells)</text>
<text class="ts" x="34" y="406" font-size="10">CO2, H2S, N2: contaminants to remove</text>
<text class="ts" x="34" y="422" font-size="10">Water: always present — must be separated</text>

<!-- Gathering line label -->
<text class="ts" x="155" y="105" text-anchor="middle" fill="#854F0B" font-size="10">gathering</text>
<text class="ts" x="155" y="117" text-anchor="middle" fill="#854F0B" font-size="10">lines</text>
<text class="ts" x="155" y="129" text-anchor="middle" fill="#854F0B" font-size="10">(2–16 in.)</text>
</svg>