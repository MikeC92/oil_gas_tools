<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<linearGradient id="shale-g" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#7a6e55"/>
  <stop offset="100%" stop-color="#5e5440"/>
</linearGradient>
</defs>

<!-- Surface pad -->
<rect x="0" y="0" width="680" height="40" fill="#6a9a58" opacity="0.6"/>
<text class="ts" x="190" y="24" text-anchor="middle" fill="#173404" font-size="11">Surface pad — multiple wells drilled from one location</text>

<!-- Frac pumpers / blenders on surface -->
<rect x="30" y="6" width="50" height="22" rx="3" fill="#444441"/>
<rect x="90" y="6" width="50" height="22" rx="3" fill="#444441"/>
<rect x="150" y="6" width="50" height="22" rx="3" fill="#444441"/>
<text class="ts" x="115" y="4" text-anchor="middle" fill="#5F5E5A" font-size="9">Frac pumpers (10,000–15,000 HP each)</text>

<!-- Vertical section -->
<rect x="183" y="40" width="14" height="200" rx="2" fill="#888780" opacity="0.7"/>
<text class="ts" x="110" y="90" text-anchor="end" fill="#5F5E5A" font-size="10">Vertical section</text>
<text class="ts" x="110" y="102" text-anchor="end" fill="#5F5E5A" font-size="10">~8,000–10,000 ft</text>
<line x1="112" y1="96" x2="183" y2="100" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>

<!-- Build section curve -->
<path d="M183 240 Q183 290 233 290" fill="none" stroke="#888780" stroke-width="14" opacity="0.7"/>

<!-- Horizontal lateral -->
<rect x="233" y="283" width="400" height="14" rx="2" fill="#888780" opacity="0.7"/>
<text class="ts" x="433" y="275" text-anchor="middle" fill="#5F5E5A" font-size="10">Horizontal lateral — 8,000–15,000 ft through shale</text>

<!-- Shale formation -->
<rect x="30" y="268" width="620" height="80" fill="url(#shale-g)" opacity="0.75"/>
<text class="ts" x="60" y="296" fill="#D3D1C7" font-size="10">Organic-rich shale — source and reservoir in one (unconventional)</text>
<text class="ts" x="60" y="312" fill="#D3D1C7" font-size="10">Very low permeability — need hydraulic fractures to flow</text>

<!-- Stage dividers (plugs) -->
<rect x="270" y="283" width="6" height="14" fill="#E8593C"/>
<rect x="340" y="283" width="6" height="14" fill="#E8593C"/>
<rect x="410" y="283" width="6" height="14" fill="#E8593C"/>
<rect x="480" y="283" width="6" height="14" fill="#E8593C"/>
<rect x="550" y="283" width="6" height="14" fill="#E8593C"/>
<text class="ts" x="433" y="316" text-anchor="middle" fill="#A32D2D" font-size="9">Plugs isolate each stage</text>

<!-- Fractures emanating from perforations -->
<!-- Stage 1 (leftmost, closest to toe) -->
<line x1="252" y1="290" x2="220" y2="255" stroke="#5ba3cc" stroke-width="1.5" opacity="0.8"/>
<line x1="252" y1="290" x2="220" y2="325" stroke="#5ba3cc" stroke-width="1.5" opacity="0.8"/>
<line x1="252" y1="290" x2="205" y2="290" stroke="#5ba3cc" stroke-width="1.5" opacity="0.8"/>
<line x1="252" y1="290" x2="225" y2="268" stroke="#5ba3cc" stroke-width="1.2" opacity="0.5"/>
<line x1="252" y1="290" x2="225" y2="312" stroke="#5ba3cc" stroke-width="1.2" opacity="0.5"/>

<!-- Stage 2 -->
<line x1="322" y1="290" x2="290" y2="255" stroke="#5ba3cc" stroke-width="1.5" opacity="0.8"/>
<line x1="322" y1="290" x2="290" y2="325" stroke="#5ba3cc" stroke-width="1.5" opacity="0.8"/>
<line x1="322" y1="290" x2="275" y2="290" stroke="#5ba3cc" stroke-width="1.5" opacity="0.8"/>
<line x1="322" y1="290" x2="295" y2="268" stroke="#5ba3cc" stroke-width="1.2" opacity="0.5"/>
<line x1="322" y1="290" x2="295" y2="312" stroke="#5ba3cc" stroke-width="1.2" opacity="0.5"/>

<!-- Stage 3 -->
<line x1="392" y1="290" x2="360" y2="255" stroke="#5ba3cc" stroke-width="1.5" opacity="0.8"/>
<line x1="392" y1="290" x2="360" y2="325" stroke="#5ba3cc" stroke-width="1.5" opacity="0.8"/>
<line x1="392" y1="290" x2="345" y2="290" stroke="#5ba3cc" stroke-width="1.5" opacity="0.8"/>

<!-- Stage 4 -->
<line x1="462" y1="290" x2="430" y2="255" stroke="#185FA5" stroke-width="1.5" opacity="0.7"/>
<line x1="462" y1="290" x2="430" y2="325" stroke="#185FA5" stroke-width="1.5" opacity="0.7"/>
<line x1="462" y1="290" x2="415" y2="290" stroke="#185FA5" stroke-width="1.5" opacity="0.7"/>

<!-- Stage 5 (being fractured now) -->
<line x1="532" y1="290" x2="500" y2="248" stroke="#E8593C" stroke-width="2" opacity="0.9"/>
<line x1="532" y1="290" x2="500" y2="332" stroke="#E8593C" stroke-width="2" opacity="0.9"/>
<line x1="532" y1="290" x2="485" y2="290" stroke="#E8593C" stroke-width="2" opacity="0.9"/>
<line x1="532" y1="290" x2="508" y2="262" stroke="#E8593C" stroke-width="1.5" opacity="0.7"/>
<line x1="532" y1="290" x2="508" y2="318" stroke="#E8593C" stroke-width="1.5" opacity="0.7"/>
<circle cx="532" cy="290" r="5" fill="#E8593C" opacity="0.8"/>
<text class="ts" x="560" y="248" fill="#A32D2D" font-size="9">Active stage</text>

<!-- Frac fluid flow line down lateral -->
<line x1="190" y1="290" x2="530" y2="290" stroke="#5ba3cc" stroke-width="1" stroke-dasharray="5 3" opacity="0.5"/>

<!-- Proppant label -->
<text class="ts" x="433" y="350" text-anchor="middle" fill="#185FA5" font-size="10">Fractures propped open with sand (proppant) — creates permeable pathway</text>

<!-- Right panel: frac fluid composition + numbers -->
<rect x="30" y="365" width="300" height="155" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="th" x="180" y="385" text-anchor="middle" font-size="12">Frac fluid composition</text>
<text class="ts" x="50" y="406" font-size="11">Water:      ~90%   (2–5 million gallons per well)</text>
<text class="ts" x="50" y="424" font-size="11">Proppant:   ~9%    (sand — 100–200 mesh)</text>
<text class="ts" x="50" y="442" font-size="11">Chemicals:  ~1%    (friction reducer, biocide,</text>
<text class="ts" x="50" y="458" font-size="11">                    scale inhibitor, surfactant)</text>
<text class="ts" x="50" y="476" font-size="11">Pressure:   10,000–15,000 PSI at surface</text>
<text class="ts" x="50" y="494" font-size="11">Rate:       ~100 bbl/min per stage</text>

<!-- Right panel: key numbers -->
<rect x="350" y="365" width="300" height="155" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="th" x="500" y="385" text-anchor="middle" font-size="12">Typical Permian Basin well</text>
<text class="ts" x="368" y="406" font-size="11">Lateral length:    ~10,000 ft (2 miles)</text>
<text class="ts" x="368" y="424" font-size="11">Frac stages:       40–60 stages</text>
<text class="ts" x="368" y="442" font-size="11">Stage spacing:     ~200 ft apart</text>
<text class="ts" x="368" y="460" font-size="11">Cluster spacing:   ~15–20 ft per stage</text>
<text class="ts" x="368" y="478" font-size="11">Well cost:         ~$7–12M all-in</text>
<text class="ts" x="368" y="496" font-size="11">IP30 (first 30-day avg): ~1,500–3,000 boe/d</text>
</svg>