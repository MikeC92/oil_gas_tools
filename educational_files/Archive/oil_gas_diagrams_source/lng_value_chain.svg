<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Step 1: Gas supply -->
<g class="node c-amber" onclick="sendPrompt('What gas sources feed LNG liquefaction plants — Haynesville, Marcellus, Permian associated gas?')">
  <rect x="20" y="60" width="110" height="68" rx="8" stroke-width="0.5"/>
  <text class="th" x="75" y="84" text-anchor="middle" dominant-baseline="central">Gas supply</text>
  <text class="ts" x="75" y="102" text-anchor="middle" dominant-baseline="central">pipeline quality</text>
  <text class="ts" x="75" y="118" text-anchor="middle" dominant-baseline="central">95%+ methane</text>
</g>
<line x1="130" y1="94" x2="158" y2="94" stroke="#BA7517" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Step 2: Pretreatment -->
<g class="node c-gray" onclick="sendPrompt('What pretreatment happens at an LNG plant before liquefaction — mercury removal, acid gas, dehydration?')">
  <rect x="160" y="60" width="110" height="68" rx="8" stroke-width="0.5"/>
  <text class="th" x="215" y="80" text-anchor="middle" dominant-baseline="central">Pretreatment</text>
  <text class="ts" x="215" y="98" text-anchor="middle" dominant-baseline="central">Hg removal</text>
  <text class="ts" x="215" y="114" text-anchor="middle" dominant-baseline="central">acid gas / dehy</text>
</g>
<line x1="270" y1="94" x2="298" y2="94" stroke="#888780" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Step 3: Liquefaction -->
<g class="node c-blue" onclick="sendPrompt('How does LNG liquefaction work — the APCI C3MR process, refrigerant cycles, train capacity?')">
  <rect x="300" y="44" width="120" height="100" rx="8" stroke-width="0.5"/>
  <text class="th" x="360" y="72" text-anchor="middle" dominant-baseline="central">Liquefaction</text>
  <text class="ts" x="360" y="90" text-anchor="middle" dominant-baseline="central">cool to -162°C</text>
  <text class="ts" x="360" y="106" text-anchor="middle" dominant-baseline="central">refrigerant cycles</text>
  <text class="ts" x="360" y="122" text-anchor="middle" dominant-baseline="central">4–5 mtpa per train</text>
</g>
<line x1="420" y1="94" x2="448" y2="94" stroke="#185FA5" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Step 4: LNG storage tanks -->
<g class="node c-blue" onclick="sendPrompt('What are LNG storage tanks — full containment tanks, BOG management, how big are they?')">
  <rect x="450" y="60" width="110" height="68" rx="8" stroke-width="0.5"/>
  <text class="th" x="505" y="80" text-anchor="middle" dominant-baseline="central">LNG storage</text>
  <text class="ts" x="505" y="98" text-anchor="middle" dominant-baseline="central">full-containment</text>
  <text class="ts" x="505" y="114" text-anchor="middle" dominant-baseline="central">tanks, ~160k m³</text>
</g>
<line x1="560" y1="94" x2="596" y2="94" stroke="#185FA5" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Step 5: Loading jetty -->
<g class="node c-blue" onclick="sendPrompt('How does LNG loading work at an export terminal — marine loading arms, BOG return, safety systems?')">
  <rect x="598" y="60" width="62" height="68" rx="8" stroke-width="0.5"/>
  <text class="th" x="629" y="84" text-anchor="middle" dominant-baseline="central">Loading</text>
  <text class="ts" x="629" y="102" text-anchor="middle" dominant-baseline="central">jetty</text>
  <text class="ts" x="629" y="118" text-anchor="middle" dominant-baseline="central">marine arm</text>
</g>

<!-- LNG carrier (ship) -->
<line x1="629" y1="128" x2="629" y2="168" stroke="#185FA5" stroke-width="1.8" marker-end="url(#arrow)"/>
<g class="node c-purple" onclick="sendPrompt('What is an LNG carrier — how big are they, what is the Moss vs membrane design, what is BOG?')">
  <rect x="550" y="170" width="110" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="605" y="194" text-anchor="middle" dominant-baseline="central">LNG carrier</text>
  <text class="ts" x="605" y="212" text-anchor="middle" dominant-baseline="central">Q-Flex: 210k m³</text>
  <text class="ts" x="605" y="228" text-anchor="middle" dominant-baseline="central">~2-week voyage</text>
  <text class="ts" x="605" y="244" text-anchor="middle" dominant-baseline="central">membrane tanks</text>
</g>

<!-- Shipping arrow -->
<line x1="550" y1="210" x2="440" y2="210" stroke="#7F77DD" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
<text class="ts" x="495" y="204" text-anchor="middle" fill="#534AB7" font-size="10">voyage 10–25 days</text>

<!-- Regasification terminal -->
<g class="node c-teal" onclick="sendPrompt('How does an LNG regasification terminal work — send-out, vaporizers, send-out pressure, FSRU?')">
  <rect x="300" y="170" width="130" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="365" y="196" text-anchor="middle" dominant-baseline="central">Regasification</text>
  <text class="ts" x="365" y="214" text-anchor="middle" dominant-baseline="central">warm to gas</text>
  <text class="ts" x="365" y="230" text-anchor="middle" dominant-baseline="central">send-out to grid</text>
  <text class="ts" x="365" y="244" text-anchor="middle" dominant-baseline="central">FSRU option</text>
</g>
<line x1="300" y1="210" x2="270" y2="210" stroke="#1D9E75" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Gas to local market -->
<g class="node c-teal" onclick="sendPrompt('Who buys regasified LNG — utilities, power generators, gas grid operators?')">
  <rect x="160" y="170" width="108" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="214" y="196" text-anchor="middle" dominant-baseline="central">Local gas grid</text>
  <text class="ts" x="214" y="214" text-anchor="middle" dominant-baseline="central">utilities, power</text>
  <text class="ts" x="214" y="230" text-anchor="middle" dominant-baseline="central">generators, industry</text>
</g>

<!-- US EXPORT ECONOMICS box -->
<rect x="20" y="280" width="310" height="130" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="175" y="300" text-anchor="middle" font-size="11">US LNG export economics (Henry Hub basis)</text>
<text class="ts" x="35" y="320" font-size="10">Henry Hub gas price:          ~$2.50/MMbtu</text>
<text class="ts" x="35" y="338" font-size="10">+ Liquefaction fee (tolling):  ~$2.25–3.50/MMbtu</text>
<text class="ts" x="35" y="356" font-size="10">+ Shipping to Asia:            ~$1.50–2.50/MMbtu</text>
<text class="ts" x="35" y="374" font-size="10">+ Regasification:              ~$0.30–0.50/MMbtu</text>
<text class="ts" x="35" y="392" font-size="10">= Landed cost Asia:            ~$7–9/MMbtu</text>
<text class="ts" x="35" y="408" font-size="10">vs. JKM (Japan/Korea Marker):  $10–16/MMbtu typical</text>

<!-- GLOBAL TRADE FLOWS box -->
<rect x="350" y="280" width="310" height="130" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="505" y="300" text-anchor="middle" font-size="11">Major LNG trade flows</text>
<text class="ts" x="365" y="320" font-size="10">US Gulf Coast → Europe (post-2022 pivot)</text>
<text class="ts" x="365" y="338" font-size="10">US Gulf Coast → Japan, Korea, Taiwan</text>
<text class="ts" x="365" y="356" font-size="10">Qatar → Asia (long-term SPA, oil-linked)</text>
<text class="ts" x="365" y="374" font-size="10">Australia → Japan, China, Korea (APLNG)</text>
<text class="ts" x="365" y="392" font-size="10">Russia (Yamal) → Europe + spot Asia</text>
<text class="ts" x="365" y="408" font-size="10">Key hubs: TTF (Europe), JKM (Asia)</text>

<!-- KEY BENCHMARKS -->
<rect x="20" y="428" width="640" height="72" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="340" y="448" text-anchor="middle" font-size="11">Key LNG price benchmarks</text>
<text class="ts" x="40" y="468" font-size="10">Henry Hub (HH): US gas benchmark — feedgas cost for US LNG. NYMEX NG futures, $/MMbtu.</text>
<text class="ts" x="40" y="486" font-size="10">JKM (Japan/Korea Marker): Asian spot LNG benchmark. Platts assessment. Most volatile. Spiked $70/MMbtu in 2022.</text>
<text class="ts" x="40" y="500" font-size="10">TTF (Title Transfer Facility): European gas hub, Netherlands. ICE-traded. Key destination for US LNG exports post-2022.</text>
</svg>