<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Header -->
<text class="th" x="340" y="22" text-anchor="middle" font-size="13">Midstream business model — fee-based infrastructure economics</text>

<!-- Three contract types -->
<text class="th" x="340" y="48" text-anchor="middle" font-size="11">Contract structures — how midstream companies get paid</text>

<!-- Fee-based -->
<g class="node c-teal" onclick="sendPrompt('Explain fee-based midstream contracts — how do take-or-pay and fixed-fee arrangements work?')">
  <rect x="30" y="58" width="190" height="130" rx="8" stroke-width="0.5"/>
  <text class="th" x="125" y="80" text-anchor="middle">Fee-based (preferred)</text>
  <text class="ts" x="48" y="102" font-size="10">Fixed $/bbl or $/Mcf per unit</text>
  <text class="ts" x="48" y="118" font-size="10">No commodity price exposure</text>
  <text class="ts" x="48" y="134" font-size="10">Take-or-pay: shipper pays</text>
  <text class="ts" x="48" y="150" font-size="10">minimum volume regardless</text>
  <text class="ts" x="48" y="166" font-size="10">Stable, bond-like cash flows</text>
  <text class="ts" x="48" y="178" font-size="10">~85% of major MLP revenue</text>
</g>

<!-- Percent-of-proceeds -->
<g class="node c-amber" onclick="sendPrompt('What is a percent-of-proceeds midstream contract and when is it used?')">
  <rect x="245" y="58" width="190" height="130" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="80" text-anchor="middle">Percent-of-proceeds</text>
  <text class="ts" x="263" y="102" font-size="10">Midstream takes % of revenue</text>
  <text class="ts" x="263" y="118" font-size="10">from selling processed gas/NGLs</text>
  <text class="ts" x="263" y="134" font-size="10">Commodity price exposure —</text>
  <text class="ts" x="263" y="150" font-size="10">if NGL prices fall, so does revenue</text>
  <text class="ts" x="263" y="166" font-size="10">Higher upside in strong markets</text>
  <text class="ts" x="263" y="178" font-size="10">Common in gas processing</text>
</g>

<!-- Keep-whole -->
<g class="node c-coral" onclick="sendPrompt('What is a keep-whole midstream contract — and why did it cause problems for processors?')">
  <rect x="460" y="58" width="190" height="130" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="80" text-anchor="middle">Keep-whole</text>
  <text class="ts" x="478" y="102" font-size="10">Processor returns BTU-equivalent</text>
  <text class="ts" x="478" y="118" font-size="10">gas regardless of NGL extracted</text>
  <text class="ts" x="478" y="134" font-size="10">Processor keeps all NGLs — but</text>
  <text class="ts" x="478" y="150" font-size="10">must buy gas if NGLs are cheap</text>
  <text class="ts" x="478" y="166" font-size="10">Very risky — caused MLP failures</text>
  <text class="ts" x="478" y="178" font-size="10">when gas/NGL ratios inverted</text>
</g>

<!-- Divider -->
<line x1="30" y1="204" x2="650" y2="204" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>

<!-- MLP structure -->
<text class="th" x="340" y="224" text-anchor="middle" font-size="11">The MLP structure — why midstream uses it</text>

<g class="node c-blue" onclick="sendPrompt('Explain master limited partnerships — MLP structure, IDRs, pass-through taxation, and why midstream uses them')">
  <rect x="30" y="234" width="290" height="170" rx="8" stroke-width="0.5"/>
  <text class="th" x="175" y="256" text-anchor="middle">Master limited partnership (MLP)</text>
  <text class="ts" x="48" y="278" font-size="10">• Publicly traded partnership — units not shares</text>
  <text class="ts" x="48" y="296" font-size="10">• Pass-through taxation: no corporate income tax</text>
  <text class="ts" x="48" y="314" font-size="10">  Partners pay tax on their pro-rata income</text>
  <text class="ts" x="48" y="332" font-size="10">• Must derive 90%+ income from qualifying sources</text>
  <text class="ts" x="48" y="350" font-size="10">  (pipelines, storage, processing count)</text>
  <text class="ts" x="48" y="368" font-size="10">• High distribution yield — key attraction for investors</text>
  <text class="ts" x="48" y="386" font-size="10">• GP holds IDRs — incentive distribution rights</text>
  <text class="ts" x="48" y="398" font-size="10">  (higher GP % as distributions grow — alignment)</text>
</g>

<!-- Key players -->
<g class="node c-purple" onclick="sendPrompt('Who are the major midstream companies — Enbridge, Enterprise, Williams, Kinder Morgan, MPLX?')">
  <rect x="360" y="234" width="290" height="170" rx="8" stroke-width="0.5"/>
  <text class="th" x="505" y="256" text-anchor="middle">Major midstream operators</text>
  <text class="ts" x="378" y="278" font-size="10">Enbridge (ENB) — largest crude pipeline network N. America</text>
  <text class="ts" x="378" y="296" font-size="10">Enterprise Products (EPD) — NGL leader, Mont Belvieu</text>
  <text class="ts" x="378" y="314" font-size="10">Williams Companies (WMB) — Transco gas pipeline</text>
  <text class="ts" x="378" y="332" font-size="10">Kinder Morgan (KMI) — largest US gas pipeline network</text>
  <text class="ts" x="378" y="350" font-size="10">MPLX (MPLX) — Marathon downstream affiliate</text>
  <text class="ts" x="378" y="368" font-size="10">Targa Resources (TRGP) — Permian gathering/processing</text>
  <text class="ts" x="378" y="386" font-size="10">TC Energy (TRP) — Canadian pipelines, Keystone</text>
  <text class="ts" x="378" y="404" font-size="10">Magellan (now part of ONEOK) — products pipelines</text>
</g>

<!-- Bottom: cash flow comparison -->
<rect x="30" y="420" width="620" height="120" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="340" y="440" text-anchor="middle" font-size="11">Why the cash flow profile attracts infrastructure investors</text>

<!-- Upstream cash flow (volatile) -->
<text class="ts" x="50" y="462" font-size="10" fill="#854F0B">Upstream CFO (volatile — moves with oil price):</text>
<rect x="50" y="468" width="20" height="40" rx="2" fill="#BA7517" opacity="0.7"/>
<rect x="78" y="490" width="20" height="18" rx="2" fill="#BA7517" opacity="0.5"/>
<rect x="106" y="472" width="20" height="36" rx="2" fill="#BA7517" opacity="0.7"/>
<rect x="134" y="498" width="20" height="10" rx="2" fill="#BA7517" opacity="0.4"/>
<rect x="162" y="468" width="20" height="40" rx="2" fill="#BA7517" opacity="0.7"/>
<rect x="190" y="480" width="20" height="28" rx="2" fill="#BA7517" opacity="0.6"/>

<!-- Midstream cash flow (stable) -->
<text class="ts" x="360" y="462" font-size="10" fill="#185FA5">Midstream DCF (stable — moves with volumes):</text>
<rect x="360" y="470" width="20" height="36" rx="2" fill="#185FA5" opacity="0.7"/>
<rect x="388" y="472" width="20" height="34" rx="2" fill="#185FA5" opacity="0.7"/>
<rect x="416" y="468" width="20" height="38" rx="2" fill="#185FA5" opacity="0.7"/>
<rect x="444" y="470" width="20" height="36" rx="2" fill="#185FA5" opacity="0.7"/>
<rect x="472" y="466" width="20" height="40" rx="2" fill="#185FA5" opacity="0.8"/>
<rect x="500" y="468" width="20" height="38" rx="2" fill="#185FA5" opacity="0.8"/>

<text class="ts" x="340" y="532" text-anchor="middle" fill="#5F5E5A" font-size="10">Midstream cash flows resemble regulated utilities — predictable, contracted, with volume as the key driver not price</text>
</svg>