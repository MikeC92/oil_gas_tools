<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- UPSTREAM -->
<g class="node c-amber" onclick="sendPrompt('Tell me more about upstream oil and gas — exploration, drilling, production')">
  <rect x="30" y="50" width="175" height="240" rx="12" stroke-width="0.5"/>
  <text class="th" x="117" y="82" text-anchor="middle">Upstream</text>
  <text class="ts" x="117" y="100" text-anchor="middle">Find it &amp; produce it</text>
  <text class="ts" x="52" y="130" font-size="11">• Exploration (seismic, geology)</text>
  <text class="ts" x="52" y="150" font-size="11">• Drilling (vertical, horizontal)</text>
  <text class="ts" x="52" y="170" font-size="11">• Completion &amp; fracking</text>
  <text class="ts" x="52" y="190" font-size="11">• Production &amp; reservoir mgmt</text>
  <text class="ts" x="52" y="218" font-size="11">ExxonMobil, Chevron, Shell</text>
  <text class="ts" x="52" y="234" font-size="11">ConocoPhillips, EOG, Pioneer</text>
  <text class="ts" x="52" y="250" font-size="11">Saudi Aramco, NOCs</text>
</g>

<!-- Arrow 1 -->
<line x1="205" y1="170" x2="248" y2="170" class="arr" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="226" y="158" text-anchor="middle">crude</text>
<text class="ts" x="226" y="170" text-anchor="middle" fill="#5F5E5A"> </text>

<!-- MIDSTREAM -->
<g class="node c-blue" onclick="sendPrompt('Tell me more about midstream — pipelines, storage, tankers, LNG')">
  <rect x="250" y="50" width="175" height="240" rx="12" stroke-width="0.5"/>
  <text class="th" x="337" y="82" text-anchor="middle">Midstream</text>
  <text class="ts" x="337" y="100" text-anchor="middle">Move it &amp; store it</text>
  <text class="ts" x="272" y="130" font-size="11">• Pipelines (crude + products)</text>
  <text class="ts" x="272" y="150" font-size="11">• Storage terminals</text>
  <text class="ts" x="272" y="170" font-size="11">• Tanker shipping (VLCC…)</text>
  <text class="ts" x="272" y="190" font-size="11">• LNG liquefaction &amp; regasification</text>
  <text class="ts" x="272" y="218" font-size="11">Enbridge, Enterprise, Williams</text>
  <text class="ts" x="272" y="234" font-size="11">Kinder Morgan, MPLX</text>
  <text class="ts" x="272" y="250" font-size="11">Frontline, Trafigura (traders)</text>
</g>

<!-- Arrow 2 -->
<line x1="425" y1="170" x2="468" y2="170" class="arr" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="446" y="158" text-anchor="middle">crude /</text>
<text class="ts" x="446" y="172" text-anchor="middle">products</text>

<!-- DOWNSTREAM -->
<g class="node c-teal" onclick="sendPrompt('Tell me more about downstream — refining, product markets, distribution')">
  <rect x="470" y="50" width="175" height="240" rx="12" stroke-width="0.5"/>
  <text class="th" x="557" y="82" text-anchor="middle">Downstream</text>
  <text class="ts" x="557" y="100" text-anchor="middle">Refine it &amp; sell it</text>
  <text class="ts" x="492" y="130" font-size="11">• Refining (distillation, cracking)</text>
  <text class="ts" x="492" y="150" font-size="11">• Petrochemicals</text>
  <text class="ts" x="492" y="170" font-size="11">• Product distribution</text>
  <text class="ts" x="492" y="190" font-size="11">• Retail (gas stations)</text>
  <text class="ts" x="492" y="218" font-size="11">Valero, Phillips 66, Marathon</text>
  <text class="ts" x="492" y="234" font-size="11">BP, Shell (integrated)</text>
  <text class="ts" x="492" y="250" font-size="11">BASF, LyondellBasell (petrochem)</text>
</g>

<!-- INTEGRATED label -->
<rect x="30" y="316" width="615" height="44" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts" x="337" y="335" text-anchor="middle">Integrated majors span all three segments</text>
<text class="ts" x="337" y="351" text-anchor="middle" fill="#5F5E5A">ExxonMobil · Chevron · BP · Shell · TotalEnergies</text>

<!-- Output labels below downstream -->
<text class="ts" x="557" y="302" text-anchor="middle" fill="#0F6E56">→ gasoline · diesel · jet fuel · HFO · naphtha · LPG</text>

</svg>