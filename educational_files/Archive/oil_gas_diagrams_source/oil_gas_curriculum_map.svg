  <text class="ts" x="550" y="199" text-anchor="middle">Z-score, percentile, composite</text>
</g>

<!-- Divider: NEXT UP -->
<rect x="30" y="228" width="620" height="12" rx="4" fill="#185FA5" opacity="0.18"/>
<text class="ts" x="340" y="238" text-anchor="middle" fill="#185FA5">Next up — midstream</text>

<!-- Row 3: Midstream options -->
<g class="node c-blue" onclick="sendPrompt('Teach me about oil and gas pipelines — infrastructure, how they work, key operators')">
