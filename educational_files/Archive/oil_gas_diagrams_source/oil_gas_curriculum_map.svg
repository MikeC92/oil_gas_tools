  <text class="ts" x="177" y="297" text-anchor="middle">Infrastructure, tariffs, FERC,</text>
  <text class="ts" x="177" y="311" text-anchor="middle">Enbridge, Enterprise, Williams</text>
</g>
<g class="node c-blue" onclick="sendPrompt('Teach me about tanker shipping and oil cargo — VLCCs, freight rates, arbitrage')">
