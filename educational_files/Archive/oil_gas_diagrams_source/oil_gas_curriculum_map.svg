  <text class="th" x="130" y="181" text-anchor="middle" dominant-baseline="central">Resources &amp; books</text>
  <text class="ts" x="130" y="199" text-anchor="middle">Yergin, Hyne, Trafigura…</text>
</g>
<g class="node c-teal" onclick="sendPrompt('Show me a summary of the WTI and Brent price monitor tool we built')">
  <rect x="250" y="158" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="181" text-anchor="middle" dominant-baseline="central">Tool 2: price monitor</text>
  <text class="ts" x="340" y="199" text-anchor="middle">WTI, Brent, spread, z-score</text>
</g>
<g class="node c-teal" onclick="sendPrompt('Explain the EIA inventory signal and how it connects to WTI price')">
  <rect x="460" y="158" width="180" height="56" rx="8" stroke-width="0.5"/>
