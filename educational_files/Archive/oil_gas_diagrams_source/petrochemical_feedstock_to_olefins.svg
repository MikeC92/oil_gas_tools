<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="380" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<title>Petrochemical feedstocks into the steam cracker</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="120" y="40" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="58" text-anchor="middle">Ethane</text><text class="ts" x="220" y="76" text-anchor="middle">From NGL processing</text></g>
<g class="c-gray"><rect x="360" y="40" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="460" y="58" text-anchor="middle">Naphtha</text><text class="ts" x="460" y="76" text-anchor="middle">From refinery CDU</text></g>
<line x1="220" y1="96" x2="285" y2="158" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<line x1="460" y1="96" x2="395" y2="158" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-coral"><rect x="240" y="160" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="178" text-anchor="middle">Steam cracker</text><text class="ts" x="340" y="196" text-anchor="middle">Extreme heat cracking</text></g>
<line x1="300" y1="216" x2="150" y2="278" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<line x1="340" y1="216" x2="340" y2="278" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<line x1="380" y1="216" x2="530" y2="278" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-teal"><rect x="42" y="280" width="185" height="56" rx="8" stroke-width="0.5"/><text class="th" x="134" y="298" text-anchor="middle">Ethylene</text><text class="ts" x="134" y="316" text-anchor="middle">Highest-volume olefin</text></g>
<g class="c-teal"><rect x="247" y="280" width="185" height="56" rx="8" stroke-width="0.5"/><text class="th" x="339" y="298" text-anchor="middle">Propylene</text><text class="ts" x="339" y="316" text-anchor="middle">Feeds polypropylene</text></g>
<g class="c-teal"><rect x="452" y="280" width="185" height="56" rx="8" stroke-width="0.5"/><text class="th" x="544" y="298" text-anchor="middle">Butadiene</text><text class="ts" x="544" y="316" text-anchor="middle">Feeds synthetic rubber</text></g>
</svg>