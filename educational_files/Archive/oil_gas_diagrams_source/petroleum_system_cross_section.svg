<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#d4e9f7"/>
  <stop offset="100%" stop-color="#a8cfe8"/>
</linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#5ba3cc" stop-opacity="0.5"/>
  <stop offset="100%" stop-color="#2d7aaa" stop-opacity="0.7"/>
</linearGradient>
</defs>

<!-- Sky / surface -->
<rect x="0" y="0" width="680" height="80" fill="url(#sky)"/>
<text class="ts" x="20" y="22" fill="#185FA5" font-size="11">Surface / seabed</text>

<!-- Water (offshore section, left) -->
<rect x="0" y="40" width="260" height="40" fill="url(#sea)" opacity="0.7"/>
<text class="ts" x="90" y="64" text-anchor="middle" fill="#042C53" font-size="11">Offshore water column</text>

<!-- Layer 1: overburden / shale seal -->
<rect x="0" y="80" width="680" height="55" rx="0" fill="#c8c1a8"/>
<text class="th" x="340" y="101" text-anchor="middle" font-size="12" fill="#2C2C2A">Overburden &amp; seal rock (cap rock)</text>
<text class="ts" x="340" y="118" text-anchor="middle" fill="#444441" font-size="11">Impermeable — shale or evaporites — stops hydrocarbons from escaping upward</text>

<!-- Anticline trap structure -->
<!-- Left flank -->
<polygon points="0,135 340,135 340,190 0,225" fill="#e8d99a" stroke="#b8a870" stroke-width="0.5"/>
<!-- Right flank -->
<polygon points="340,135 680,225 680,135 340,135" fill="#e8d99a" stroke="#b8a870" stroke-width="0.5"/>

<!-- Gas cap (top of anticline) -->
<ellipse cx="340" cy="148" rx="90" ry="18" fill="#f0e070" opacity="0.85"/>
<text class="ts" x="340" y="152" text-anchor="middle" fill="#412402" font-size="11">Gas cap</text>

<!-- Oil zone -->
<ellipse cx="340" cy="172" rx="130" ry="20" fill="#c08020" opacity="0.7"/>
<text class="ts" x="340" y="176" text-anchor="middle" fill="#fff" font-size="11">Oil zone (reservoir rock)</text>

<!-- Water leg below oil -->
<rect x="170" y="185" width="340" height="28" rx="4" fill="#5ba3cc" opacity="0.55"/>
<text class="ts" x="340" y="203" text-anchor="middle" fill="#042C53" font-size="11">Water leg (formation water)</text>

<!-- Layer: Source rock (deeper) -->
<rect x="0" y="260" width="680" height="50" fill="#7a6e55"/>
<text class="th" x="340" y="280" text-anchor="middle" fill="#FAC775" font-size="12">Source rock</text>
<text class="ts" x="340" y="296" text-anchor="middle" fill="#FAEEDA" font-size="11">Organic-rich shale — where kerogen was cooked into oil &amp; gas over millions of years</text>

<!-- Migration arrows -->
<path d="M340 258 L340 215" class="arr" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<path d="M260 258 L290 215" class="arr" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<path d="M420 258 L390 215" class="arr" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

<!-- Migration label -->
<text class="ts" x="560" y="240" text-anchor="middle" fill="#854F0B" font-size="11">Migration upward</text>
<text class="ts" x="560" y="254" text-anchor="middle" fill="#854F0B" font-size="11">through porous rock</text>

<!-- Basement -->
<rect x="0" y="310" width="680" height="40" fill="#555048"/>
<text class="ts" x="340" y="334" text-anchor="middle" fill="#D3D1C7" font-size="11">Basement rock (non-productive)</text>

<!-- Right side labels -->
<line x1="470" y1="107" x2="570" y2="90" class="leader" stroke="#888780"/>
<text class="ts" x="576" y="88" fill="#5F5E5A" font-size="11">Cap rock / seal</text>

<line x1="468" y1="152" x2="570" y2="138" class="leader" stroke="#888780"/>
<text class="ts" x="576" y="136" fill="#5F5E5A" font-size="11">Gas cap</text>

<line x1="468" y1="172" x2="570" y2="175" class="leader" stroke="#888780"/>
<text class="ts" x="576" y="173" fill="#5F5E5A" font-size="11">Oil reservoir</text>

<line x1="508" y1="199" x2="570" y2="210" class="leader" stroke="#888780"/>
<text class="ts" x="576" y="208" fill="#5F5E5A" font-size="11">Water leg</text>

<!-- Anticline label -->
<text class="th" x="60" y="155" fill="#633806" font-size="12">Anticline trap</text>
<path d="M110 158 Q180 135 340 135" fill="none" stroke="#BA7517" stroke-width="0.8" stroke-dasharray="3 3"/>

<!-- Heat & pressure label -->
<text class="ts" x="60" y="290" fill="#FAC775" font-size="11">Heat + pressure</text>
<text class="ts" x="60" y="303" fill="#FAC775" font-size="11">= kerogen → oil/gas</text>

<!-- Depth markers -->
<text class="ts" x="20" y="165" fill="#5F5E5A" font-size="10">~1–3 km</text>
<text class="ts" x="20" y="285" fill="#D3D1C7" font-size="10">~2–5 km</text>

<!-- 5 elements label -->
<rect x="20" y="370" width="640" height="90" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="340" y="390" text-anchor="middle" font-size="12">The 5 elements of a petroleum system</text>
<text class="ts" x="50" y="412" font-size="11">1. Source rock — organic-rich shale that generated hydrocarbons under heat &amp; pressure</text>
<text class="ts" x="50" y="430" font-size="11">2. Reservoir rock — porous &amp; permeable (sandstone, limestone) that holds the oil/gas</text>
<text class="ts" x="50" y="448" font-size="11">3. Cap / seal rock — impermeable layer that traps hydrocarbons and stops upward migration</text>
<text class="ts" x="50" y="454" font-size="11"> </text>
<text class="ts" x="340" y="448" font-size="11">4. Trap structure — anticline, fault, stratigraphic trap    5. Timing — generation before trap formed</text>
</svg>