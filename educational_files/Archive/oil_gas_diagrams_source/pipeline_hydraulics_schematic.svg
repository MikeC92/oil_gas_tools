<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Pipeline tube (crude — amber) -->
<rect x="40" y="190" width="600" height="28" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<rect x="40" y="190" width="600" height="8" rx="4" fill="#EF9F27" opacity="0.3"/>

<!-- Flow direction arrow inside pipe -->
<line x1="80" y1="204" x2="580" y2="204" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
<text class="ts" x="330" y="209" text-anchor="middle" fill="#633806" font-size="10">crude flow →</text>

<!-- Origin: Midland TX -->
<g class="node c-amber" onclick="sendPrompt('What is the Permian Basin origin point for crude pipelines — Midland and Wink/Odessa terminals')">
  <rect x="20" y="130" width="100" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="70" y="151" text-anchor="middle" dominant-baseline="central">Midland, TX</text>
  <text class="ts" x="70" y="169" text-anchor="middle" dominant-baseline="central">Permian origin</text>
  <text class="ts" x="70" y="183" text-anchor="middle" dominant-baseline="central">~6 mb/d basin</text>
</g>
<line x1="120" y1="186" x2="120" y2="190" stroke="#BA7517" stroke-width="1.5"/>

<!-- Pump station 1 -->
<g class="node c-gray" onclick="sendPrompt('How does a crude oil pump station work — centrifugal pumps, pressure boosting, SCADA control')">
  <rect x="158" y="158" width="84" height="60" rx="8" stroke-width="0.5"/>
  <text class="th" x="200" y="178" text-anchor="middle" dominant-baseline="central">Pump stn 1</text>
  <text class="ts" x="200" y="196" text-anchor="middle" dominant-baseline="central">~1,500 HP</text>
  <text class="ts" x="200" y="210" text-anchor="middle" dominant-baseline="central">+600 PSI</text>
</g>
<line x1="200" y1="218" x2="200" y2="228" stroke="#888780" stroke-width="1"/>
<line x1="200" y1="190" x2="200" y2="190" stroke="#888780" stroke-width="1"/>

<!-- Pump station 2 -->
<g class="node c-gray" onclick="sendPrompt('How does a crude oil pump station work — centrifugal pumps, pressure boosting, SCADA control')">
  <rect x="298" y="158" width="84" height="60" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central">Pump stn 2</text>
  <text class="ts" x="340" y="196" text-anchor="middle" dominant-baseline="central">~1,500 HP</text>
  <text class="ts" x="340" y="210" text-anchor="middle" dominant-baseline="central">+600 PSI</text>
</g>

<!-- Pump station 3 -->
<g class="node c-gray" onclick="sendPrompt('How does a crude oil pump station work — centrifugal pumps, pressure boosting, SCADA control')">
  <rect x="438" y="158" width="84" height="60" rx="8" stroke-width="0.5"/>
  <text class="th" x="480" y="178" text-anchor="middle" dominant-baseline="central">Pump stn 3</text>
  <text class="ts" x="480" y="196" text-anchor="middle" dominant-baseline="central">~1,500 HP</text>
  <text class="ts" x="480" y="210" text-anchor="middle" dominant-baseline="central">+600 PSI</text>
</g>

<!-- Destination: Cushing -->
<g class="node c-amber" onclick="sendPrompt('Explain how Cushing Oklahoma works as a crude oil trading and storage hub')">
  <rect x="560" y="130" width="100" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="610" y="151" text-anchor="middle" dominant-baseline="central">Cushing, OK</text>
  <text class="ts" x="610" y="169" text-anchor="middle" dominant-baseline="central">WTI hub</text>
  <text class="ts" x="610" y="183" text-anchor="middle" dominant-baseline="central">~90 MMbbl cap.</text>
</g>
<line x1="560" y1="186" x2="560" y2="190" stroke="#BA7517" stroke-width="1.5"/>

<!-- Pressure profile (below the pipe) -->
<text class="ts" x="330" y="245" text-anchor="middle" fill="#5F5E5A" font-size="10">Hydraulic pressure profile along pipeline</text>
<!-- Pressure profile line -->
<polyline points="120,260 158,262 200,280 242,295 298,297 340,316 382,332 438,334 480,354 522,370 560,372"
  fill="none" stroke="#E8593C" stroke-width="1.5"/>
<!-- Pump boosts -->
<polyline points="200,280 200,264" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="340,316 340,300" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="480,354 480,338" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
<!-- Max allowable operating pressure line -->
<line x1="120" y1="262" x2="560" y2="262" stroke="#E8593C" stroke-width="0.8" stroke-dasharray="5 3"/>
<text class="ts" x="130" y="258" fill="#A32D2D" font-size="9">MAOP limit</text>
<!-- Minimum pressure line -->
<line x1="120" y1="374" x2="560" y2="374" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="5 3"/>
<text class="ts" x="130" y="382" fill="#185FA5" font-size="9">min. inlet pressure</text>

<!-- Labels for pump boost arrows -->
<text class="ts" x="215" y="272" fill="#1D9E75" font-size="9">boost</text>
<text class="ts" x="355" y="308" fill="#1D9E75" font-size="9">boost</text>
<text class="ts" x="495" y="346" fill="#1D9E75" font-size="9">boost</text>

<!-- PIPE CROSS SECTION (bottom left) -->
<text class="th" x="110" y="412" text-anchor="middle" font-size="11">Pipe cross-section</text>
<circle cx="110" cy="450" r="36" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
<circle cx="110" cy="450" r="30" fill="#EF9F27" opacity="0.4"/>
<circle cx="110" cy="450" r="4" fill="#BA7517"/>
<text class="ts" x="155" y="430" font-size="10">Steel wall</text>
<line x1="142" y1="428" x2="130" y2="432" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="155" y="446" font-size="10">Internal coating</text>
<line x1="152" y1="444" x2="136" y2="446" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="155" y="462" font-size="10">Crude oil flow</text>
<line x1="152" y1="460" x2="120" y2="454" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="80" y="492" text-anchor="middle" fill="#5F5E5A" font-size="9">16–36 inch diameter typical</text>

<!-- KEY PIPELINE SPECS (right) -->
<rect x="290" y="400" width="360" height="68" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="470" y="418" text-anchor="middle" font-size="11">Crude pipeline key parameters</text>
<text class="ts" x="304" y="436" font-size="10">Diameter: 16–48 in.    Pressure: 500–1,200 PSI operating</text>
<text class="ts" x="304" y="452" font-size="10">Throughput: 400 kb/d (20 in.) → 1.5 mb/d (36 in.)</text>
<text class="ts" x="304" y="468" font-size="10">Velocity: ~3–8 ft/sec    Station spacing: ~50–100 miles</text>
</svg>