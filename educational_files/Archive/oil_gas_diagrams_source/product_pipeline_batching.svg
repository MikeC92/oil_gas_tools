<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="220" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
