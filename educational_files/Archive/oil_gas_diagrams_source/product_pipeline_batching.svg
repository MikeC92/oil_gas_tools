<line x1="595" y1="108" x2="630" y2="108" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-gray"><rect x="500" y="20" width="160" height="48" rx="8" stroke-width="0.5"/><text class="th" x="580" y="38" text-anchor="middle">East Coast terminal</text><text class="ts" x="580" y="56" text-anchor="middle">batches separated, stored</text></g>
<line x1="595" y1="98" x2="590" y2="70" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<text class="ts" x="350" y="190" text-anchor="middle" fill="#5F5E5A">Same pipe, different products back to back — small mixing zones at each boundary</text>
