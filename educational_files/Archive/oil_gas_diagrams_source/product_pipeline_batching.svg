<title>Refined products pipeline batching</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="20" y="80" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="80" y="98" text-anchor="middle">Gulf Coast</text><text class="ts" x="80" y="116" text-anchor="middle">refinery gate</text></g>
<rect x="150" y="98" width="440" height="20" rx="10" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<rect x="154" y="100" width="90" height="16" rx="2" class="c-amber" stroke-width="0"/>
<rect x="248" y="100" width="70" height="16" rx="2" class="c-blue" stroke-width="0"/>
