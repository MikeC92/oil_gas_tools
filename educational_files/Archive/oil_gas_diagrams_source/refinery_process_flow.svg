<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="580" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<title>Refinery process flow</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="20" y="240" width="90" height="44" rx="6" stroke-width="0.5"/><text class="th" x="65" y="266" text-anchor="middle">Crude oil</text></g>
<line x1="110" y1="262" x2="138" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-blue"><rect x="140" y="220" width="110" height="84" rx="8" stroke-width="0.5"/><text class="th" x="195" y="254" text-anchor="middle">CDU</text><text class="ts" x="195" y="272" text-anchor="middle">Crude distillation</text><text class="ts" x="195" y="287" text-anchor="middle">unit</text></g>
<line x1="195" y1="220" x2="195" y2="175" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="250" y1="240" x2="310" y2="210" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="250" y1="262" x2="310" y2="262" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="250" y1="284" x2="310" y2="320" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="195" y1="304" x2="195" y2="350" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="140" y="130" width="110" height="44" rx="6" stroke-width="0.5"/><text class="th" x="195" y="150" text-anchor="middle">Naphtha / gas</text><text class="ts" x="195" y="165" text-anchor="middle">gasoline blendstock</text></g>
<line x1="250" y1="152" x2="312" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-teal"><rect x="314" y="120" width="120" height="64" rx="8" stroke-width="0.5"/><text class="th" x="374" y="146" text-anchor="middle">Cat reformer</text><text class="ts" x="374" y="163" text-anchor="middle">high-octane gasoline</text><text class="ts" x="374" y="178" text-anchor="middle">+ hydrogen</text></g>
<line x1="434" y1="152" x2="490" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-gray"><rect x="492" y="130" width="116" height="44" rx="6" stroke-width="0.5"/><text class="th" x="550" y="150" text-anchor="middle">Gasoline + H₂</text><text class="ts" x="550" y="165" text-anchor="middle">fuel + refinery use</text></g>
<g class="c-teal"><rect x="314" y="194" width="120" height="44" rx="6" stroke-width="0.5"/><text class="th" x="374" y="214" text-anchor="middle">Hydrotreater</text><text class="ts" x="374" y="229" text-anchor="middle">jet fuel / kerosene</text></g>
<line x1="434" y1="216" x2="490" y2="216" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-gray"><rect x="492" y="194" width="116" height="44" rx="6" stroke-width="0.5"/><text class="th" x="550" y="214" text-anchor="middle">Jet fuel (ULSK)</text><text class="ts" x="550" y="229" text-anchor="middle">aviation</text></g>
<g class="c-teal"><rect x="314" y="248" width="120" height="44" rx="6" stroke-width="0.5"/><text class="th" x="374" y="268" text-anchor="middle">Hydrotreater</text><text class="ts" x="374" y="283" text-anchor="middle">diesel / gasoil</text></g>
<line x1="434" y1="270" x2="490" y2="270" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-gray"><rect x="492" y="248" width="116" height="44" rx="6" stroke-width="0.5"/><text class="th" x="550" y="268" text-anchor="middle">ULSD diesel</text><text class="ts" x="550" y="283" text-anchor="middle">&lt;15 ppm sulfur</text></g>
<g class="c-coral"><rect x="314" y="304" width="120" height="64" rx="8" stroke-width="0.5"/><text class="th" x="374" y="330" text-anchor="middle">FCC</text><text class="ts" x="374" y="347" text-anchor="middle">fluid catalytic</text><text class="ts" x="374" y="362" text-anchor="middle">cracker (VGO)</text></g>
<line x1="434" y1="336" x2="490" y2="336" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-gray"><rect x="492" y="314" width="116" height="44" rx="6" stroke-width="0.5"/><text class="th" x="550" y="334" text-anchor="middle">Gasoline + LPG</text><text class="ts" x="550" y="349" text-anchor="middle">high-octane fuel</text></g>
<g class="c-gray"><rect x="140" y="350" width="110" height="44" rx="6" stroke-width="0.5"/><text class="th" x="195" y="370" text-anchor="middle">VDU</text><text class="ts" x="195" y="385" text-anchor="middle">vacuum distillation</text></g>
<line x1="250" y1="372" x2="312" y2="400" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
<line x1="195" y1="394" x2="195" y2="428" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-coral"><rect x="140" y="430" width="110" height="64" rx="8" stroke-width="0.5"/><text class="th" x="195" y="456" text-anchor="middle">Delayed coker</text><text class="ts" x="195" y="473" text-anchor="middle">cracks vacuum</text><text class="ts" x="195" y="488" text-anchor="middle">residue</text></g>
<line x1="250" y1="462" x2="312" y2="462" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
<g class="c-gray"><rect x="314" y="430" width="120" height="64" rx="6" stroke-width="0.5"/><text class="th" x="374" y="456" text-anchor="middle">Light products</text><text class="ts" x="374" y="473" text-anchor="middle">+ petcoke</text><text class="ts" x="374" y="488" text-anchor="middle">cement / aluminum</text></g>
<g class="c-coral"><rect x="314" y="388" width="120" height="36" rx="6" stroke-width="0.5"/><text class="th" x="374" y="406" text-anchor="middle">FCC / hydrocracker</text><text class="ts" x="374" y="419" text-anchor="middle">VGO upgrade</text></g>
<line x1="434" y1="406" x2="490" y2="392" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>
<g class="c-gray"><rect x="492" y="370" width="116" height="44" rx="6" stroke-width="0.5"/><text class="th" x="550" y="390" text-anchor="middle">Diesel + gasoline</text><text class="ts" x="550" y="405" text-anchor="middle">high-value products</text></g>
<text class="ts" x="340" y="550" text-anchor="middle" fill="#5F5E5A">Refinery complexity = ability to convert bottom-of-barrel to high-value light products</text>
<text class="ts" x="340" y="566" text-anchor="middle" fill="#5F5E5A">Measured by Nelson Complexity Index (NCI)</text>
</svg>