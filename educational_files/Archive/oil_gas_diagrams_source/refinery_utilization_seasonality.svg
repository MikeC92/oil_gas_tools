<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="340" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<title>Refinery utilization seasonality</title>
<text class="th" x="340" y="26" text-anchor="middle" fill="#2C2C2A">Refinery utilization — typical seasonal shape</text>
<text class="ts" x="340" y="44" text-anchor="middle" fill="#5F5E5A">Planned maintenance is predictable; unplanned outages are not</text>
<rect x="118" y="70" width="86" height="190" rx="3" fill="#BA7517" stroke="none" opacity="0.18"/>
<rect x="420" y="70" width="86" height="190" rx="3" fill="#BA7517" stroke="none" opacity="0.18"/>
<text class="ts" x="161" y="86" text-anchor="middle" fill="#5F5E5A">spring</text>
<text class="ts" x="161" y="100" text-anchor="middle" fill="#5F5E5A">turnaround</text>
<text class="ts" x="463" y="86" text-anchor="middle" fill="#5F5E5A">fall</text>
<text class="ts" x="463" y="100" text-anchor="middle" fill="#5F5E5A">turnaround</text>
<line x1="60" y1="260" x2="640" y2="260" stroke="#5F5E5A" stroke-width="1" opacity="0.4"/>
<line x1="60" y1="130" x2="640" y2="130" stroke="#5F5E5A" stroke-width="0.5" opacity="0.25" stroke-dasharray="4 4"/>
<text class="ts" x="52" y="134" text-anchor="end" fill="#5F5E5A">95%</text>
<line x1="60" y1="195" x2="640" y2="195" stroke="#5F5E5A" stroke-width="0.5" opacity="0.25" stroke-dasharray="4 4"/>
<text class="ts" x="52" y="199" text-anchor="end" fill="#5F5E5A">85%</text>
<text class="ts" x="52" y="264" text-anchor="end" fill="#5F5E5A">75%</text>
<polyline points="75,155 118,162 161,205 204,175 247,140 290,128 333,132 376,145 420,168 463,208 506,178 549,150 592,142 635,158" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="290" cy="128" r="4" fill="#D85A30"/>
<text class="ts" x="290" y="118" text-anchor="middle" fill="#5F5E5A">summer peak</text>
<circle cx="592" cy="142" r="4" fill="#D85A30"/>
<text class="ts" x="592" y="132" text-anchor="middle" fill="#5F5E5A">winter</text>
<text class="ts" x="75" y="280" text-anchor="middle" fill="#5F5E5A">Jan</text>
<text class="ts" x="161" y="280" text-anchor="middle" fill="#5F5E5A">Mar</text>
<text class="ts" x="247" y="280" text-anchor="middle" fill="#5F5E5A">May</text>
<text class="ts" x="333" y="280" text-anchor="middle" fill="#5F5E5A">Jul</text>
<text class="ts" x="420" y="280" text-anchor="middle" fill="#5F5E5A">Sep</text>
<text class="ts" x="506" y="280" text-anchor="middle" fill="#5F5E5A">Nov</text>
<text class="ts" x="592" y="280" text-anchor="middle" fill="#5F5E5A">Dec</text>
<text class="ts" x="340" y="312" text-anchor="middle" fill="#5F5E5A">Utilization = crude throughput ÷ operable capacity. Sub-80% signals weak margins or outage.</text>
</svg>