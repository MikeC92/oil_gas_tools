<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- WORLDSCALE section -->
<g class="node c-blue" onclick="sendPrompt('Explain the Worldscale freight rate system in detail — how is WS100 calculated and why does it exist?')">
  <rect x="30" y="30" width="290" height="130" rx="10" stroke-width="0.5"/>
  <text class="th" x="175" y="54" text-anchor="middle" dominant-baseline="central">Worldscale (WS) rate system</text>
  <text class="ts" x="48" y="80" font-size="10">WS 100 = flat rate ($/mt) for a specific route</text>
  <text class="ts" x="48" y="98" font-size="10">Calculated annually by Worldscale Association</text>
  <text class="ts" x="48" y="116" font-size="10">Assumes standard vessel, speed, port costs</text>
  <text class="ts" x="48" y="134" font-size="10">WS 50 = 50% of flat rate (weak market)</text>
  <text class="ts" x="48" y="152" font-size="10">WS 200 = 200% of flat rate (strong market)</text>
</g>

<!-- TCE section -->
<g class="node c-blue" onclick="sendPrompt('What is TCE — time charter equivalent — and why do analysts use it instead of Worldscale?')">
  <rect x="360" y="30" width="290" height="130" rx="10" stroke-width="0.5"/>
  <text class="th" x="505" y="54" text-anchor="middle" dominant-baseline="central">TCE — time charter equivalent</text>
  <text class="ts" x="378" y="80" font-size="10">Converts voyage revenue to daily equivalent</text>
  <text class="ts" x="378" y="98" font-size="10">TCE = (freight revenue − voyage costs) ÷ voyage days</text>
  <text class="ts" x="378" y="116" font-size="10">Voyage costs: bunker fuel, port fees, canal tolls</text>
  <text class="ts" x="378" y="134" font-size="10">Allows apples-to-apples comparison across routes</text>
  <text class="ts" x="378" y="152" font-size="10">VLCC TCE range: $15k–$100k+/day (very volatile)</text>
</g>

<!-- CHARTER TYPES -->
<text class="th" x="340" y="186" text-anchor="middle" font-size="12">Charter market structures</text>

<!-- Voyage charter -->
<g class="node c-amber" onclick="sendPrompt('Explain a voyage charter in tanker shipping — who pays for what, how does it differ from time charter?')">
  <rect x="30" y="200" width="192" height="130" rx="8" stroke-width="0.5"/>
  <text class="th" x="126" y="224" text-anchor="middle" dominant-baseline="central">Voyage charter</text>
  <text class="ts" x="48" y="250" font-size="10">Fixed cargo, fixed route</text>
  <text class="ts" x="48" y="268" font-size="10">Owner pays opex + bunkers</text>
  <text class="ts" x="48" y="286" font-size="10">Charterer pays freight ($/mt)</text>
  <text class="ts" x="48" y="304" font-size="10">Short-term: 1 voyage only</text>
  <text class="ts" x="48" y="318" font-size="10">Spot market — most volatile</text>
</g>

<!-- Time charter -->
<g class="node c-amber" onclick="sendPrompt('How does a time charter work in shipping — owner responsibilities vs charterer responsibilities?')">
  <rect x="244" y="200" width="192" height="130" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="224" text-anchor="middle" dominant-baseline="central">Time charter</text>
  <text class="ts" x="262" y="250" font-size="10">Charterer hires vessel for period</text>
  <text class="ts" x="262" y="268" font-size="10">Owner pays opex + crew</text>
  <text class="ts" x="262" y="286" font-size="10">Charterer pays bunkers + voyage</text>
  <text class="ts" x="262" y="304" font-size="10">Fixed daily hire rate ($/day)</text>
  <text class="ts" x="262" y="318" font-size="10">6 months to 5+ years</text>
</g>

<!-- Bareboat charter -->
<g class="node c-amber" onclick="sendPrompt('What is a bareboat charter — how is it different from time charter, when is it used?')">
  <rect x="458" y="200" width="192" height="130" rx="8" stroke-width="0.5"/>
  <text class="th" x="554" y="224" text-anchor="middle" dominant-baseline="central">Bareboat charter</text>
  <text class="ts" x="476" y="250" font-size="10">Charterer gets full vessel control</text>
  <text class="ts" x="476" y="268" font-size="10">Charterer pays ALL costs</text>
  <text class="ts" x="476" y="286" font-size="10">Owner just finances the asset</text>
  <text class="ts" x="476" y="304" font-size="10">Effectively a financing lease</text>
  <text class="ts" x="476" y="318" font-size="10">NOCs, long-term industrial users</text>
</g>

<!-- Risk allocation arrows -->
<text class="th" x="340" y="356" text-anchor="middle" font-size="11">Commodity price risk allocation across charter types</text>

<rect x="30" y="368" width="620" height="44" rx="6" fill="#F4F2EC" stroke="#D3D1C7" stroke-width="0.5"/>
<!-- Risk spectrum bar -->
<rect x="50" y="378" width="168" height="22" rx="3" fill="#BA7517" opacity="0.7"/>
<text class="ts" x="134" y="393" text-anchor="middle" fill="#412402" font-size="9">Voyage: owner bears all freight rate risk</text>
<rect x="236" y="378" width="168" height="22" rx="3" fill="#EF9F27" opacity="0.6"/>
<text class="ts" x="320" y="393" text-anchor="middle" fill="#412402" font-size="9">Time: charterer bears rate movement</text>
<rect x="422" y="378" width="208" height="22" rx="3" fill="#FAC775" opacity="0.5"/>
<text class="ts" x="526" y="393" text-anchor="middle" fill="#412402" font-size="9">Bareboat: charterer bears everything</text>

<!-- Key rate drivers -->
<rect x="30" y="428" width="620" height="112" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="340" y="448" text-anchor="middle" font-size="11">What drives spot freight rates</text>
<text class="ts" x="50" y="468" font-size="10">Supply: active fleet size, vessels in drydock, scrapping rate, orderbook deliveries, vessel speed (slow steaming reduces effective supply)</text>
<text class="ts" x="50" y="486" font-size="10">Demand: volume of crude/products traded × average haul distance (ton-miles) — longer routes consume more ship-days</text>
<text class="ts" x="50" y="504" font-size="10">Seasonal: Q4/Q1 northern hemisphere winter demand spike; summer driving season for products; refinery maintenance seasons</text>
<text class="ts" x="50" y="522" font-size="10">Geopolitical: sanctions (shadow fleet creation), chokepoint closures (Hormuz, Suez), route diversions all move ton-miles</text>
<text class="ts" x="50" y="540" font-size="10">Bunker fuel cost: ~40–60% of voyage cost; moves with oil price; VLSFO (very low sulfur fuel oil) post-IMO 2020 rule</text>
</svg>