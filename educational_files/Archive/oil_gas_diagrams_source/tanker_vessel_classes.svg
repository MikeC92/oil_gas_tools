<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Header -->
<text class="th" x="340" y="22" text-anchor="middle" font-size="13">Tanker vessel classes — crude oil and products</text>

<!-- Size scale bar -->
<rect x="40" y="36" width="600" height="8" rx="4" fill="#B5D4F4" opacity="0.4"/>
<text class="ts" x="40" y="56" fill="#185FA5" font-size="10">Smaller / coastal</text>
<text class="ts" x="640" y="56" text-anchor="end" fill="#185FA5" font-size="10">Larger / long-haul</text>

<!-- CRUDE TANKERS ROW -->
<text class="th" x="40" y="78" font-size="11" fill="#0C447C">Crude oil tankers</text>

<!-- VLCC -->
<g class="node c-blue" onclick="sendPrompt('Tell me about VLCCs — Very Large Crude Carriers — size, routes, economics, major owners')">
  <rect x="460" y="88" width="180" height="100" rx="8" stroke-width="0.5"/>
  <text class="th" x="550" y="110" text-anchor="middle" dominant-baseline="central">VLCC</text>
  <text class="ts" x="550" y="128" text-anchor="middle" dominant-baseline="central">Very Large Crude Carrier</text>
  <text class="ts" x="550" y="146" text-anchor="middle" dominant-baseline="central">200,000–320,000 DWT</text>
  <text class="ts" x="550" y="162" text-anchor="middle" dominant-baseline="central">~2 million bbl capacity</text>
  <text class="ts" x="550" y="178" text-anchor="middle" dominant-baseline="central">Middle East → Asia/Europe</text>
</g>

<!-- Suezmax -->
<g class="node c-blue" onclick="sendPrompt('What is a Suezmax tanker — why that name, what routes do they serve?')">
  <rect x="310" y="88" width="140" height="100" rx="8" stroke-width="0.5"/>
  <text class="th" x="380" y="110" text-anchor="middle" dominant-baseline="central">Suezmax</text>
  <text class="ts" x="380" y="128" text-anchor="middle" dominant-baseline="central">120,000–200,000 DWT</text>
  <text class="ts" x="380" y="146" text-anchor="middle" dominant-baseline="central">~1 million bbl</text>
  <text class="ts" x="380" y="164" text-anchor="middle" dominant-baseline="central">Max fits Suez Canal</text>
  <text class="ts" x="380" y="180" text-anchor="middle" dominant-baseline="central">W. Africa → Europe/US</text>
</g>

<!-- Aframax -->
<g class="node c-blue" onclick="sendPrompt('What is an Aframax tanker — Average Freight Rate Assessment, typical trades and routes?')">
  <rect x="180" y="88" width="122" height="100" rx="8" stroke-width="0.5"/>
  <text class="th" x="241" y="110" text-anchor="middle" dominant-baseline="central">Aframax</text>
  <text class="ts" x="241" y="128" text-anchor="middle" dominant-baseline="central">80,000–120,000 DWT</text>
  <text class="ts" x="241" y="146" text-anchor="middle" dominant-baseline="central">~750,000 bbl</text>
  <text class="ts" x="241" y="164" text-anchor="middle" dominant-baseline="central">Fits most ports</text>
  <text class="ts" x="241" y="180" text-anchor="middle" dominant-baseline="central">Med, Caribbean, North Sea</text>
</g>

<!-- Panamax crude -->
<g class="node c-blue" onclick="sendPrompt('What is a Panamax crude tanker and how does the Panama Canal size constraint work?')">
  <rect x="60" y="88" width="112" height="100" rx="8" stroke-width="0.5"/>
  <text class="th" x="116" y="110" text-anchor="middle" dominant-baseline="central">Panamax</text>
  <text class="ts" x="116" y="128" text-anchor="middle" dominant-baseline="central">55,000–80,000 DWT</text>
  <text class="ts" x="116" y="146" text-anchor="middle" dominant-baseline="central">~500,000 bbl</text>
  <text class="ts" x="116" y="164" text-anchor="middle" dominant-baseline="central">Fits Panama Canal</text>
  <text class="ts" x="116" y="180" text-anchor="middle" dominant-baseline="central">Americas trades</text>
</g>

<!-- Size illustration (ship silhouettes relative to each other) -->
<rect x="60" y="202" width="580" height="44" rx="6" fill="#F4F2EC" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="70" y="220" fill="#5F5E5A" font-size="9">Relative size (hull length):</text>
<!-- Panamax ship -->
<rect x="130" y="212" width="60" height="16" rx="3" fill="#85B7EB" opacity="0.7"/>
<text class="ts" x="160" y="223" text-anchor="middle" fill="#0C447C" font-size="8">Panamax ~230m</text>
<!-- Aframax -->
<rect x="210" y="210" width="80" height="20" rx="3" fill="#378ADD" opacity="0.7"/>
<text class="ts" x="250" y="224" text-anchor="middle" fill="#042C53" font-size="8">Aframax ~250m</text>
<!-- Suezmax -->
<rect x="310" y="208" width="110" height="24" rx="3" fill="#185FA5" opacity="0.7"/>
<text class="ts" x="365" y="224" text-anchor="middle" fill="#E6F1FB" font-size="8">Suezmax ~275m</text>
<!-- VLCC -->
<rect x="440" y="205" width="180" height="30" rx="3" fill="#0C447C" opacity="0.8"/>
<text class="ts" x="530" y="224" text-anchor="middle" fill="#E6F1FB" font-size="8">VLCC ~330m (Eiffel Tower on its side)</text>

<!-- PRODUCTS TANKERS ROW -->
<text class="th" x="40" y="268" font-size="11" fill="#085041">Refined products tankers</text>

<!-- LR2 -->
<g class="node c-teal" onclick="sendPrompt('What is an LR2 tanker — Long Range 2 — what products does it carry and on what routes?')">
  <rect x="460" y="278" width="180" height="88" rx="8" stroke-width="0.5"/>
  <text class="th" x="550" y="300" text-anchor="middle" dominant-baseline="central">LR2</text>
  <text class="ts" x="550" y="318" text-anchor="middle" dominant-baseline="central">Long Range 2</text>
  <text class="ts" x="550" y="336" text-anchor="middle" dominant-baseline="central">80,000–120,000 DWT</text>
  <text class="ts" x="550" y="354" text-anchor="middle" dominant-baseline="central">Clean or dirty — naphtha, jet</text>
</g>

<!-- LR1 -->
<g class="node c-teal" onclick="sendPrompt('What is an LR1 tanker and how does it differ from LR2 in terms of cargo and trades?')">
  <rect x="330" y="278" width="122" height="88" rx="8" stroke-width="0.5"/>
  <text class="th" x="391" y="300" text-anchor="middle" dominant-baseline="central">LR1</text>
  <text class="ts" x="391" y="318" text-anchor="middle" dominant-baseline="central">Long Range 1</text>
  <text class="ts" x="391" y="336" text-anchor="middle" dominant-baseline="central">55,000–80,000 DWT</text>
  <text class="ts" x="391" y="354" text-anchor="middle" dominant-baseline="central">Gasoline, jet, diesel</text>
</g>

<!-- MR -->
<g class="node c-teal" onclick="sendPrompt('What is an MR tanker — Medium Range — the workhorse of refined products shipping?')">
  <rect x="190" y="278" width="132" height="88" rx="8" stroke-width="0.5"/>
  <text class="th" x="256" y="300" text-anchor="middle" dominant-baseline="central">MR tanker</text>
  <text class="ts" x="256" y="318" text-anchor="middle" dominant-baseline="central">Medium Range</text>
  <text class="ts" x="256" y="336" text-anchor="middle" dominant-baseline="central">25,000–55,000 DWT</text>
  <text class="ts" x="256" y="354" text-anchor="middle" dominant-baseline="central">Gasoline, diesel — workhorse</text>
</g>

<!-- Handy -->
<g class="node c-teal" onclick="sendPrompt('What is a Handysize or chemical tanker and what specialty cargoes do they move?')">
  <rect x="60" y="278" width="122" height="88" rx="8" stroke-width="0.5"/>
  <text class="th" x="121" y="300" text-anchor="middle" dominant-baseline="central">Handysize</text>
  <text class="ts" x="121" y="318" text-anchor="middle" dominant-baseline="central">10,000–25,000 DWT</text>
  <text class="ts" x="121" y="336" text-anchor="middle" dominant-baseline="central">Chemicals, lube oils</text>
  <text class="ts" x="121" y="354" text-anchor="middle" dominant-baseline="central">Coastal / regional</text>
</g>

<!-- SPECIALTY ROW -->
<text class="th" x="40" y="392" font-size="11" fill="#3C3489">Specialty vessels</text>

<g class="node c-purple" onclick="sendPrompt('What are LNG carriers — Moss sphere vs membrane design, Q-Flex, Q-Max — how do they work?')">
  <rect x="60" y="402" width="178" height="76" rx="8" stroke-width="0.5"/>
  <text class="th" x="149" y="424" text-anchor="middle" dominant-baseline="central">LNG carrier</text>
  <text class="ts" x="149" y="442" text-anchor="middle" dominant-baseline="central">Q-Flex: 210,000 m³</text>
  <text class="ts" x="149" y="458" text-anchor="middle" dominant-baseline="central">Q-Max: 266,000 m³</text>
  <text class="ts" x="149" y="470" text-anchor="middle" dominant-baseline="central">Membrane or Moss sphere tanks</text>
</g>

<g class="node c-purple" onclick="sendPrompt('What are LPG carriers — VLGC class — how does pressurized gas shipping work?')">
  <rect x="258" y="402" width="162" height="76" rx="8" stroke-width="0.5"/>
  <text class="th" x="339" y="424" text-anchor="middle" dominant-baseline="central">VLGC</text>
  <text class="ts" x="339" y="442" text-anchor="middle" dominant-baseline="central">Very Large Gas Carrier</text>
  <text class="ts" x="339" y="458" text-anchor="middle" dominant-baseline="central">80,000–85,000 m³</text>
  <text class="ts" x="339" y="474" text-anchor="middle" dominant-baseline="central">LPG: propane, butane</text>
</g>

<g class="node c-purple" onclick="sendPrompt('What is an FSO or FPSO vessel and how does offshore floating production work?')">
  <rect x="440" y="402" width="200" height="76" rx="8" stroke-width="0.5"/>
  <text class="th" x="540" y="424" text-anchor="middle" dominant-baseline="central">FPSO / FSO</text>
  <text class="ts" x="540" y="442" text-anchor="middle" dominant-baseline="central">Floating Production Storage</text>
  <text class="ts" x="540" y="458" text-anchor="middle" dominant-baseline="central">Offshore field processing</text>
  <text class="ts" x="540" y="474" text-anchor="middle" dominant-baseline="central">Offloads to shuttle tankers</text>
</g>

<!-- Clean vs dirty distinction -->
<rect x="60" y="496" width="560" height="64" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="340" y="514" text-anchor="middle" font-size="11">Clean vs dirty tankers — a critical commercial distinction</text>
<text class="ts" x="76" y="534" font-size="10">Dirty: carries crude oil or fuel oil — black, viscous, hard to clean. Crude tankers, dirty products tankers (HFO).</text>
<text class="ts" x="76" y="550" font-size="10">Clean: carries light refined products — gasoline, diesel, jet, naphtha. Tanks must be cleaned (tank washing) before switching.</text>
</svg>