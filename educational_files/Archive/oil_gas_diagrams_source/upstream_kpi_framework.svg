<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Header -->
<text class="th" x="340" y="22" text-anchor="middle" font-size="14">Upstream KPI framework</text>

<!-- ROW 1: Production + Reserves -->
<g class="node c-amber" onclick="sendPrompt('Explain upstream production KPIs — BOE, working interest, net production, GOR, WOR, uptime')">
  <rect x="30" y="36" width="300" height="150" rx="10" stroke-width="0.5"/>
  <text class="th" x="180" y="58" text-anchor="middle">Production KPIs</text>
  <text class="ts" x="50" y="78" font-size="11">Gross / net production (boe/d)</text>
  <text class="ts" x="50" y="96" font-size="11">Working interest (WI) — your % of gross</text>
  <text class="ts" x="50" y="114" font-size="11">NRI — net revenue interest (after royalties)</text>
  <text class="ts" x="50" y="132" font-size="11">GOR — gas-oil ratio (signals depletion)</text>
  <text class="ts" x="50" y="150" font-size="11">WOR / water cut — rising = late life</text>
  <text class="ts" x="50" y="168" font-size="11">Uptime / production efficiency %</text>
</g>

<g class="node c-blue" onclick="sendPrompt('Explain reserves metrics — 1P 2P 3P, RLI, reserve replacement ratio, finding costs')">
  <rect x="350" y="36" width="300" height="150" rx="10" stroke-width="0.5"/>
  <text class="th" x="500" y="58" text-anchor="middle">Reserves metrics</text>
  <text class="ts" x="370" y="78" font-size="11">1P / 2P / 3P (proved, probable, possible)</text>
  <text class="ts" x="370" y="96" font-size="11">RLI — reserve life index = 2P ÷ production</text>
  <text class="ts" x="370" y="114" font-size="11">RRR — reserve replacement ratio</text>
  <text class="ts" x="370" y="132" font-size="11">Finding & development costs (F&D, $/boe)</text>
  <text class="ts" x="370" y="150" font-size="11">Recycle ratio = netback ÷ F&D cost</text>
  <text class="ts" x="370" y="168" font-size="11">PV10 / NPV10 — PV of reserves at 10% disc.</text>
</g>

<!-- ROW 2: Cost structure + Profitability -->
<g class="node c-teal" onclick="sendPrompt('Walk me through upstream cost structure — LOE, G&A, DD&A, opex vs capex')">
  <rect x="30" y="202" width="300" height="160" rx="10" stroke-width="0.5"/>
  <text class="th" x="180" y="224" text-anchor="middle">Cost structure ($/boe)</text>
  <text class="ts" x="50" y="244" font-size="11">LOE — lease operating expense (field costs)</text>
  <text class="ts" x="50" y="262" font-size="11">G&amp;A — general &amp; administrative</text>
  <text class="ts" x="50" y="280" font-size="11">DD&amp;A — depletion, depreciation, amortization</text>
  <text class="ts" x="50" y="298" font-size="11">Royalties — paid to mineral rights owner</text>
  <text class="ts" x="50" y="316" font-size="11">Production taxes — severance, ad valorem</text>
  <text class="ts" x="50" y="334" font-size="11">Gathering, transport, processing (GTP)</text>
  <text class="ts" x="50" y="352" font-size="11">Full-cycle cost = LOE + G&amp;A + DD&amp;A + F&amp;D</text>
</g>

<g class="node c-green" onclick="sendPrompt('Explain upstream profitability metrics — netback, operating margin, EBITDAX, free cash flow')">
  <rect x="350" y="202" width="300" height="160" rx="10" stroke-width="0.5"/>
  <text class="th" x="500" y="224" text-anchor="middle">Profitability metrics</text>
  <text class="ts" x="370" y="244" font-size="11">Netback = realized price − royalties − opex</text>
  <text class="ts" x="370" y="262" font-size="11">Operating netback ($/boe) — key comparator</text>
  <text class="ts" x="370" y="280" font-size="11">EBITDAX — EBITDA + exploration expense</text>
  <text class="ts" x="370" y="298" font-size="11">Cash flow from operations (CFO)</text>
  <text class="ts" x="370" y="316" font-size="11">Free cash flow = CFO − capex</text>
  <text class="ts" x="370" y="334" font-size="11">Break-even price ($/bbl WTI to cover costs)</text>
  <text class="ts" x="370" y="352" font-size="11">IRR / NPV per well — project economics</text>
</g>

<!-- ROW 3: Equity valuation + Capital efficiency -->
<g class="node c-purple" onclick="sendPrompt('How do analysts value upstream E&P companies — EV/EBITDAX, EV/2P, NAV, PV10?')">
  <rect x="30" y="378" width="300" height="160" rx="10" stroke-width="0.5"/>
  <text class="th" x="180" y="400" text-anchor="middle">Equity valuation multiples</text>
  <text class="ts" x="50" y="420" font-size="11">EV/EBITDAX — most common trading multiple</text>
  <text class="ts" x="50" y="438" font-size="11">EV/2P — enterprise value per 2P boe</text>
  <text class="ts" x="50" y="456" font-size="11">EV/boepd — EV per daily production barrel</text>
  <text class="ts" x="50" y="474" font-size="11">P/NAV — price vs net asset value</text>
  <text class="ts" x="50" y="492" font-size="11">P/CF — price to cash flow</text>
  <text class="ts" x="50" y="510" font-size="11">Dividend yield / buyback yield</text>
  <text class="ts" x="50" y="528" font-size="11">Debt/EBITDAX — leverage check</text>
</g>

<g class="node c-coral" onclick="sendPrompt('Explain capital efficiency metrics in upstream — ROCE, reinvestment rate, capital intensity')">
  <rect x="350" y="378" width="300" height="160" rx="10" stroke-width="0.5"/>
  <text class="th" x="500" y="400" text-anchor="middle">Capital efficiency</text>
  <text class="ts" x="370" y="420" font-size="11">ROCE — return on capital employed</text>
  <text class="ts" x="370" y="438" font-size="11">Capital intensity = capex ÷ production</text>
  <text class="ts" x="370" y="456" font-size="11">Reinvestment rate = capex ÷ CFO</text>
  <text class="ts" x="370" y="474" font-size="11">D&C cost per lateral foot (shale)</text>
  <text class="ts" x="370" y="492" font-size="11">IP30 / IP90 — initial production rates</text>
  <text class="ts" x="370" y="510" font-size="11">EUR per well and EUR per $1M spent</text>
  <text class="ts" x="370" y="528" font-size="11">Payout period — months to recover well cost</text>
</g>

<!-- Bottom: waterfall concept -->
<rect x="30" y="554" width="620" height="110" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="340" y="574" text-anchor="middle" font-size="12">Netback waterfall — from wellhead to free cash flow ($/boe)</text>

<!-- Waterfall bars (illustrative) -->
<rect x="50" y="584" width="68" height="60" rx="3" fill="#1D9E75" opacity="0.7"/>
<text class="ts" x="84" y="600" text-anchor="middle" fill="#04342C" font-size="9">Realized</text>
<text class="ts" x="84" y="612" text-anchor="middle" fill="#04342C" font-size="9">price</text>
<text class="ts" x="84" y="636" text-anchor="middle" fill="#04342C" font-size="9">~$70</text>

<text class="ts" x="136" y="618" text-anchor="middle" fill="#5F5E5A" font-size="11">−</text>
<rect x="148" y="614" width="52" height="30" rx="3" fill="#E8593C" opacity="0.6"/>
<text class="ts" x="174" y="626" text-anchor="middle" fill="#501313" font-size="9">Royalty</text>
<text class="ts" x="174" y="638" text-anchor="middle" fill="#501313" font-size="9">~$10</text>

<text class="ts" x="218" y="618" text-anchor="middle" fill="#5F5E5A" font-size="11">−</text>
<rect x="228" y="606" width="52" height="38" rx="3" fill="#E8593C" opacity="0.6"/>
<text class="ts" x="254" y="620" text-anchor="middle" fill="#501313" font-size="9">LOE+GTP</text>
<text class="ts" x="254" y="634" text-anchor="middle" fill="#501313" font-size="9">~$14</text>

<text class="ts" x="298" y="618" text-anchor="middle" fill="#5F5E5A" font-size="11">−</text>
<rect x="308" y="616" width="52" height="28" rx="3" fill="#BA7517" opacity="0.6"/>
<text class="ts" x="334" y="630" text-anchor="middle" fill="#412402" font-size="9">G&amp;A ~$6</text>

<text class="ts" x="378" y="618" text-anchor="middle" fill="#5F5E5A" font-size="11">−</text>
<rect x="388" y="608" width="52" height="36" rx="3" fill="#BA7517" opacity="0.6"/>
<text class="ts" x="414" y="622" text-anchor="middle" fill="#412402" font-size="9">DD&amp;A</text>
<text class="ts" x="414" y="634" text-anchor="middle" fill="#412402" font-size="9">~$12</text>

<text class="ts" x="458" y="618" text-anchor="middle" fill="#5F5E5A" font-size="11">−</text>
<rect x="468" y="612" width="52" height="32" rx="3" fill="#888780" opacity="0.5"/>
<text class="ts" x="494" y="626" text-anchor="middle" fill="#2C2C2A" font-size="9">Tax ~$8</text>

<text class="ts" x="538" y="618" text-anchor="middle" fill="#1D9E75" font-size="11">=</text>
<rect x="548" y="596" width="60" height="48" rx="3" fill="#1D9E75" opacity="0.8"/>
<text class="ts" x="578" y="614" text-anchor="middle" fill="#04342C" font-size="9">Net income</text>
<text class="ts" x="578" y="628" text-anchor="middle" fill="#04342C" font-size="9">~$20/boe</text>
<text class="ts" x="578" y="656" text-anchor="middle" fill="#5F5E5A" font-size="9">+ DD&amp;A add-back → CFO</text>
</svg>