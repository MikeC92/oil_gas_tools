<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Phase 1: Exploration -->
<g class="node c-amber" onclick="sendPrompt('Explain seismic surveying and exploration geology in detail')">
  <rect x="30" y="30" width="290" height="100" rx="10" stroke-width="0.5"/>
  <text class="th" x="175" y="55" text-anchor="middle">1. Exploration</text>
  <text class="ts" x="50" y="78" font-size="11">• Seismic surveys (2D, 3D, 4D) — sound waves map rock layers</text>
  <text class="ts" x="50" y="96" font-size="11">• Gravity &amp; magnetic surveys</text>
  <text class="ts" x="50" y="114" font-size="11">• Basin analysis, play fairway mapping</text>
</g>

<!-- Phase 2: Appraisal -->
<g class="node c-amber" onclick="sendPrompt('What happens during the appraisal phase — wildcat wells, logging, resource estimation?')">
  <rect x="360" y="30" width="290" height="100" rx="10" stroke-width="0.5"/>
  <text class="th" x="505" y="55" text-anchor="middle">2. Appraisal</text>
  <text class="ts" x="380" y="78" font-size="11">• Wildcat well (first drill into prospect)</text>
  <text class="ts" x="380" y="96" font-size="11">• Well logging (resistivity, porosity, gamma ray)</text>
  <text class="ts" x="380" y="114" font-size="11">• Flow testing — confirm commerciality</text>
</g>

<line x1="320" y1="80" x2="358" y2="80" class="arr" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Arrow down from exploration side -->
<line x1="175" y1="130" x2="175" y2="168" class="arr" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Phase 3: Development drilling -->
<g class="node c-blue" onclick="sendPrompt('Explain the drilling process — rig types, drill string, mud, casing, completions')">
  <rect x="30" y="170" width="290" height="130" rx="10" stroke-width="0.5"/>
  <text class="th" x="175" y="196" text-anchor="middle">3. Development drilling</text>
  <text class="ts" x="50" y="220" font-size="11">• Rig types: jackup (shallow), semi-sub, drillship (deepwater)</text>
  <text class="ts" x="50" y="238" font-size="11">• Drill string: kelly/top drive → drill pipe → BHA → bit</text>
  <text class="ts" x="50" y="256" font-size="11">• Drilling mud: pressure control + cuttings removal</text>
  <text class="ts" x="50" y="274" font-size="11">• Casing &amp; cementing: steel pipe run &amp; cemented in stages</text>
</g>

<!-- Phase 4: Completions & fracking -->
<g class="node c-blue" onclick="sendPrompt('Explain well completions and hydraulic fracturing — how does fracking work?')">
  <rect x="360" y="170" width="290" height="130" rx="10" stroke-width="0.5"/>
  <text class="th" x="505" y="196" text-anchor="middle">4. Completions &amp; fracking</text>
  <text class="ts" x="380" y="220" font-size="11">• Perforation: shaped charges punch holes in casing</text>
  <text class="ts" x="380" y="238" font-size="11">• Hydraulic fracturing: high-pressure fluid cracks rock</text>
  <text class="ts" x="380" y="256" font-size="11">• Proppant (sand/ceramic) holds fractures open</text>
  <text class="ts" x="380" y="274" font-size="11">• Horizontal wells: 1–3 mile laterals, multi-stage frack</text>
</g>

<line x1="320" y1="235" x2="358" y2="235" class="arr" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="175" y1="300" x2="175" y2="338" class="arr" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Phase 5: Production -->
<g class="node c-teal" onclick="sendPrompt('Explain production — artificial lift, GOR, decline curves, reservoir management')">
  <rect x="30" y="340" width="290" height="130" rx="10" stroke-width="0.5"/>
  <text class="th" x="175" y="366" text-anchor="middle">5. Production</text>
  <text class="ts" x="50" y="390" font-size="11">• Primary recovery: natural pressure drives flow</text>
  <text class="ts" x="50" y="408" font-size="11">• Artificial lift: rod pumps, ESPs, gas lift</text>
  <text class="ts" x="50" y="426" font-size="11">• Decline curves: exponential, hyperbolic, harmonic</text>
  <text class="ts" x="50" y="444" font-size="11">• GOR (gas-oil ratio): rises as reservoir pressure drops</text>
</g>

<!-- Phase 6: EOR -->
<g class="node c-teal" onclick="sendPrompt('What is EOR — enhanced oil recovery — waterflood, CO2 injection, steamflood?')">
  <rect x="360" y="340" width="290" height="130" rx="10" stroke-width="0.5"/>
  <text class="th" x="505" y="366" text-anchor="middle">6. Enhanced oil recovery (EOR)</text>
  <text class="ts" x="380" y="390" font-size="11">• Secondary: waterflood (inject water to maintain pressure)</text>
  <text class="ts" x="380" y="408" font-size="11">• Tertiary: CO₂ injection, steamflood (heavy oil), polymer</text>
  <text class="ts" x="380" y="426" font-size="11">• Recovery factor: primary ~20%, EOR can push to 40–60%</text>
  <text class="ts" x="380" y="444" font-size="11">• Shale: each frac stage essentially a mini primary recovery</text>
</g>

<line x1="320" y1="405" x2="358" y2="405" class="arr" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Reserves classification box -->
<rect x="30" y="496" width="620" height="100" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="340" y="518" text-anchor="middle" font-size="12">Reserves classification (SPE-PRMS)</text>
<text class="ts" x="60" y="540" font-size="11">1P (Proved): 90% confidence will be produced under current conditions</text>
<text class="ts" x="60" y="558" font-size="11">2P (Proved + Probable): 50% confidence — used in most company valuations</text>
<text class="ts" x="60" y="576" font-size="11">3P (Proved + Probable + Possible): 10% confidence — upside case</text>
<text class="ts" x="60" y="594" font-size="11">Resources (contingent/prospective): not yet commercial or discovered — earlier in the funnel</text>

</svg>