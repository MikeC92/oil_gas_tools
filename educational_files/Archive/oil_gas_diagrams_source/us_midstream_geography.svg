<text class="ts" x="362" y="318" text-anchor="middle" fill="#712B13" font-size="8">Haynesville</text>

<!-- KEY PIPELINE CORRIDORS -->

<!-- Permian to Cushing (Midland to Cushing) -->
<path d="M295 315 Q290 285 260 265 Q240 245 245 215" fill="none" stroke="#BA7517" stroke-width="2.5" stroke-dasharray="0"/>
<text class="ts" x="263" y="272" fill="#854F0B" font-size="8">Permian→Cushing</text>

<!-- Cushing marker -->
<circle cx="245" cy="210" r="10" fill="#BA7517" opacity="0.8"/>
<text class="ts" x="245" y="213" text-anchor="middle" fill="#fff" font-size="8">CUS</text>
<text class="ts" x="270" y="206" fill="#633806" font-size="9">Cushing, OK</text>
<text class="ts" x="270" y="218" fill="#633806" font-size="8">WTI hub</text>

<!-- Cushing to Gulf Coast -->
<path d="M245 220 Q255 255 280 280" fill="none" stroke="#BA7517" stroke-width="2" stroke-dasharray="0"/>

<!-- Permian to Gulf Coast (direct) -->
<path d="M295 320 Q300 340 305 355" fill="none" stroke="#BA7517" stroke-width="2"/>

<!-- Gulf Coast export point -->
<circle cx="308" cy="365" r="8" fill="#E8593C" opacity="0.8"/>
<text class="ts" x="308" y="368" text-anchor="middle" fill="#fff" font-size="7">GC</text>
<text class="ts" x="320" y="360" fill="#A32D2D" font-size="8">Gulf Coast</text>
<text class="ts" x="320" y="372" fill="#A32D2D" font-size="8">export hub</text>

<!-- Marcellus to Northeast (Transco) -->
<path d="M500 150 Q530 160 555 170 Q575 190 580 220" fill="none" stroke="#185FA5" stroke-width="2.5"/>
<text class="ts" x="566" y="194" fill="#0C447C" font-size="8">Transco</text>

<!-- Marcellus south to Gulf -->
<path d="M490 165 Q480 200 460 230 Q430 265 400 290" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="4 2"/>

<!-- Bakken to Cushing (Dakota Access) -->
<path d="M230 108 Q235 140 238 175 Q240 195 245 208" fill="none" stroke="#1D9E75" stroke-width="2"/>
<text class="ts" x="222" y="155" fill="#085041" font-size="8">DAPL</text>

<!-- Colonial Pipeline (Gulf to East Coast) -->
<path d="M340 350 Q380 320 430 290 Q480 260 540 240 Q570 230 575 215" fill="none" stroke="#639922" stroke-width="2.5"/>
<text class="ts" x="468" y="288" fill="#27500A" font-size="8">Colonial</text>
<text class="ts" x="468" y="299" fill="#27500A" font-size="8">Pipeline</text>

<!-- LNG export (Sabine Pass) -->
<circle cx="340" cy="362" r="7" fill="#7F77DD" opacity="0.8"/>
<text class="ts" x="340" y="365" text-anchor="middle" fill="#fff" font-size="7">LNG</text>
<text class="ts" x="352" y="357" fill="#3C3489" font-size="8">Sabine Pass /</text>
<text class="ts" x="352" y="368" fill="#3C3489" font-size="8">Corpus Christi</text>

<!-- Henry Hub marker -->
<circle cx="370" cy="300" r="7" fill="#185FA5" opacity="0.8"/>
<text class="ts" x="370" y="303" text-anchor="middle" fill="#fff" font-size="7">HH</text>
<text class="ts" x="383" y="295" fill="#185FA5" font-size="8">Henry Hub</text>
<text class="ts" x="383" y="306" fill="#185FA5" font-size="8">gas price</text>
<text class="ts" x="383" y="316" fill="#185FA5" font-size="8">benchmark</text>

<!-- Mont Belvieu -->
<circle cx="315" cy="348" r="7" fill="#1D9E75" opacity="0.8"/>
<text class="ts" x="315" y="351" text-anchor="middle" fill="#fff" font-size="7">MB</text>
<text class="ts" x="328" y="340" fill="#085041" font-size="8">Mont Belvieu</text>
<text class="ts" x="328" y="350" fill="#085041" font-size="8">NGL hub</text>

<!-- LOOP (deepwater) -->
<circle cx="355" cy="388" r="7" fill="#BA7517" opacity="0.7"/>
<text class="ts" x="355" y="391" text-anchor="middle" fill="#fff" font-size="7">LOOP</text>

<!-- Northeast demand (NYC/Boston) -->
<circle cx="578" cy="118" r="7" fill="#888780" opacity="0.7"/>
<text class="ts" x="578" y="121" text-anchor="middle" fill="#fff" font-size="7">NE</text>
<text class="ts" x="590" y="113" fill="#5F5E5A" font-size="8">NE demand</text>
<text class="ts" x="590" y="124" fill="#5F5E5A" font-size="8">(gas, heating)</text>

<!-- LEGEND -->
<rect x="30" y="398" width="380" height="70" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="220" y="416" text-anchor="middle" font-size="10">Key hubs &amp; corridors (stylized — not to scale)</text>
<circle cx="48" cy="430" r="5" fill="#BA7517" opacity="0.8"/><text class="ts" x="58" y="434" font-size="9">Crude hub</text>
<circle cx="120" cy="430" r="5" fill="#185FA5" opacity="0.8"/><text class="ts" x="130" y="434" font-size="9">Gas hub</text>
<circle cx="186" cy="430" r="5" fill="#1D9E75" opacity="0.8"/><text class="ts" x="196" y="434" font-size="9">NGL hub</text>
<circle cx="252" cy="430" r="5" fill="#E8593C" opacity="0.8"/><text class="ts" x="262" y="434" font-size="9">Export terminal</text>
<circle cx="330" cy="430" r="5" fill="#7F77DD" opacity="0.8"/><text class="ts" x="340" y="434" font-size="9">LNG terminal</text>
<line x1="38" y1="454" x2="65" y2="454" stroke="#BA7517" stroke-width="2"/><text class="ts" x="70" y="458" font-size="9">Crude pipeline</text>
<line x1="130" y1="454" x2="157" y2="454" stroke="#185FA5" stroke-width="2"/><text class="ts" x="162" y="458" font-size="9">Gas pipeline</text>
<line x1="220" y1="454" x2="247" y2="454" stroke="#639922" stroke-width="2"/><text class="ts" x="252" y="458" font-size="9">Products pipeline</text>

<!-- Title -->
<text class="th" x="530" y="420" text-anchor="middle" font-size="10">Production basins</text>
<rect x="458" y="428" width="10" height="10" rx="2" fill="#BA7517" opacity="0.2"/><text class="ts" x="474" y="437" font-size="9">Permian/EF (oil)</text>
<rect x="458" y="444" width="10" height="10" rx="2" fill="#185FA5" opacity="0.2"/><text class="ts" x="474" y="453" font-size="9">Marcellus (gas)</text>
<rect x="548" y="428" width="10" height="10" rx="2" fill="#1D9E75" opacity="0.2"/><text class="ts" x="564" y="437" font-size="9">Bakken (oil)</text>
<rect x="548" y="444" width="10" height="10" rx="2" fill="#7F77DD" opacity="0.2"/><text class="ts" x="564" y="453" font-size="9">DJ/Niobrara</text>
