<line x1="300" y1="166" x2="396" y2="208" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="530" y1="166" x2="509" y2="208" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="600" y1="166" x2="622" y2="208" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<g class="c-blue"><rect x="5" y="210" width="105" height="56" rx="8" stroke-width="0.5"/><text class="th" x="57" y="230" text-anchor="middle">Power</text><text class="ts" x="57" y="248" text-anchor="middle">36.8 · 36%</text></g>
<g class="c-blue"><rect x="118" y="210" width="105" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="230" text-anchor="middle">Industrial</text><text class="ts" x="170" y="248" text-anchor="middle">23.4 · 23%</text></g>
<g class="c-blue"><rect x="231" y="210" width="105" height="56" rx="8" stroke-width="0.5"/><text class="th" x="283" y="230" text-anchor="middle">Residential</text><text class="ts" x="283" y="248" text-anchor="middle">12.0 · 12%</text></g>
<g class="c-blue"><rect x="344" y="210" width="105" height="56" rx="8" stroke-width="0.5"/><text class="th" x="396" y="230" text-anchor="middle">Commercial</text><text class="ts" x="396" y="248" text-anchor="middle">9.1 · 9%</text></g>
<g class="c-teal"><rect x="457" y="210" width="105" height="56" rx="8" stroke-width="0.5"/><text class="th" x="509" y="230" text-anchor="middle">LNG</text><text class="ts" x="509" y="248" text-anchor="middle">~12.9 · 13%</text></g>
<g class="c-teal"><rect x="570" y="210" width="105" height="56" rx="8" stroke-width="0.5"/><text class="th" x="622" y="230" text-anchor="middle">Pipeline</text><text class="ts" x="622" y="248" text-anchor="middle">~8.1 · 8%</text></g>
<text class="ts" x="340" y="292" text-anchor="middle" fill="#5F5E5A">Values in Bcf/d and % of total 2024 dry gas production. LNG/pipeline split approximate.</text>
</svg>