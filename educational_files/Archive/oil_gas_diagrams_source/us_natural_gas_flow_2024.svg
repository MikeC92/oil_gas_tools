<title>2024 US dry natural gas production flow</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="287" y="20" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="397" y="38" text-anchor="middle">US Dry Gas Production</text><text class="ts" x="397" y="56" text-anchor="middle">103.1 Bcf/d · 2024</text></g>
<line x1="360" y1="76" x2="227" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
<line x1="440" y1="76" x2="566" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
