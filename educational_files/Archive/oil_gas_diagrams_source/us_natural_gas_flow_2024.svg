<g class="c-teal"><rect x="466" y="110" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="566" y="128" text-anchor="middle">Exports</text><text class="ts" x="566" y="146" text-anchor="middle">21.0 Bcf/d · 20%</text></g>
<line x1="150" y1="166" x2="57" y2="208" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
