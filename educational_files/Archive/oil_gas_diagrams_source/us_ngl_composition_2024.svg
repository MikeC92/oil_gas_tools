<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="310" viewBox="0 0 680 310" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<title>US natural gas liquids composition and end uses</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="210" y="20" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="38" text-anchor="middle">Total NGL Production</text><text class="ts" x="340" y="56" text-anchor="middle">~6.2M bbl/d · 2024 (approx.)</text></g>
<line x1="270" y1="76" x2="95" y2="108" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="320" y1="76" x2="258" y2="108" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="360" y1="76" x2="421" y2="108" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="410" y1="76" x2="584" y2="108" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<g class="c-blue"><rect x="20" y="110" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="95" y="128" text-anchor="middle">Ethane</text><text class="ts" x="95" y="146" text-anchor="middle">2.8M · ~45%</text></g>
<g class="c-blue"><rect x="183" y="110" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="258" y="128" text-anchor="middle">Propane</text><text class="ts" x="258" y="146" text-anchor="middle">~2.2M · ~30%</text></g>
<g class="c-blue"><rect x="346" y="110" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="421" y="128" text-anchor="middle">Butanes</text><text class="ts" x="421" y="146" text-anchor="middle">~0.8M · ~13%</text></g>
<g class="c-blue"><rect x="509" y="110" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="584" y="128" text-anchor="middle">Nat. gasoline</text><text class="ts" x="584" y="146" text-anchor="middle">~0.6M · ~10%</text></g>
<line x1="95" y1="166" x2="95" y2="208" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="258" y1="166" x2="258" y2="208" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="421" y1="166" x2="421" y2="208" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<line x1="584" y1="166" x2="584" y2="208" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
<g class="c-amber"><rect x="20" y="210" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="95" y="228" text-anchor="middle">→ Ethylene</text><text class="ts" x="95" y="246" text-anchor="middle">Petrochemical use</text></g>
<g class="c-amber"><rect x="183" y="210" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="258" y="228" text-anchor="middle">Mixed uses</text><text class="ts" x="258" y="246" text-anchor="middle">~40% to petrochem</text></g>
<g class="c-amber"><rect x="346" y="210" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="421" y="228" text-anchor="middle">Blending</text><text class="ts" x="421" y="246" text-anchor="middle">67% into gasoline</text></g>
<g class="c-amber"><rect x="509" y="210" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="584" y="228" text-anchor="middle">Blending</text><text class="ts" x="584" y="246" text-anchor="middle">Gasoline + diluent</text></g>
<text class="ts" x="340" y="290" text-anchor="middle" fill="#5F5E5A">Composition shares approximate, based on typical EIA-reported NGL splits</text>
</svg>