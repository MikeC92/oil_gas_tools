<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.th{font-size:13px;font-weight:600;fill:#1A1A18}
.ts{font-size:11px;fill:#62615C}
.node{stroke-width:.5}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none;opacity:.6}
.leader{stroke:#5F5E5A;stroke-width:.5;opacity:.4}
g.c-blue>rect,g.c-blue>circle,rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}
g.c-blue>.th{fill:#0C447C} g.c-blue>.ts{fill:#185FA5}
g.c-teal>rect,g.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
g.c-teal>.th{fill:#085041} g.c-teal>.ts{fill:#0F6E56}
g.c-coral>rect,g.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}
g.c-coral>.th{fill:#712B13} g.c-coral>.ts{fill:#993C1D}
g.c-amber>rect,g.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}
g.c-amber>.th{fill:#633806} g.c-amber>.ts{fill:#854F0B}
g.c-gray>rect,g.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#888780}
g.c-gray>.th{fill:#2C2C2A} g.c-gray>.ts{fill:#5F5E5A}
g.c-purple>rect,g.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFB;stroke:#534AB7}
g.c-purple>.th{fill:#3C3489} g.c-purple>.ts{fill:#534AB7}
g.c-green>rect,g.c-green>circle,rect.c-green,circle.c-green{fill:#EDF5E5;stroke:#6a9a58}
g.c-green>.th{fill:#27500A} g.c-green>.ts{fill:#3d6b2a}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Title row -->
<text class="th" x="340" y="26" text-anchor="middle" font-size="13">Well log interpretation — reading the formation</text>
<text class="ts" x="340" y="42" text-anchor="middle">Each track is a sensor reading vs. depth — together they reveal lithology, porosity, and fluid type</text>

<!-- Depth axis -->
<rect x="30" y="60" width="30" height="360" rx="4" fill="#F4F2EC" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="45" y="78" text-anchor="middle" fill="#5F5E5A" font-size="10">Depth</text>
<text class="ts" x="45" y="96" text-anchor="middle" fill="#5F5E5A" font-size="9">2000m</text>
<text class="ts" x="45" y="196" text-anchor="middle" fill="#5F5E5A" font-size="9">2100m</text>
<text class="ts" x="45" y="296" text-anchor="middle" fill="#5F5E5A" font-size="9">2200m</text>
<text class="ts" x="45" y="396" text-anchor="middle" fill="#5F5E5A" font-size="9">2300m</text>

<!-- Track 1: Gamma Ray -->
<rect x="70" y="60" width="90" height="360" rx="4" fill="#F4F2EC" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="115" y="76" text-anchor="middle" fill="#5F5E5A" font-size="10">Gamma Ray</text>
<text class="ts" x="115" y="87" text-anchor="middle" fill="#5F5E5A" font-size="9">lithology</text>
<!-- GR curve: high = shale, low = sand -->
<polyline points="140,100 140,120 100,130 100,145 140,158 140,175 100,190 90,210 100,230 100,248 140,260 140,275 100,285 95,300 100,315 100,330 140,345 140,415" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<!-- Shale fill -->
<polygon points="160,100 140,100 140,120 160,120" fill="#c8c1a8" opacity="0.4"/>
<polygon points="160,125 100,130 100,145 160,145" fill="#c8c1a8" opacity="0.3"/>
<!-- Sand fill (reservoir zone 2120-2180m) -->
<polygon points="160,148 100,158 100,248 160,248" fill="#e8d99a" opacity="0.5"/>
<text class="ts" x="115" y="205" text-anchor="middle" fill="#633806" font-size="9">SAND</text>
<text class="ts" x="115" y="96" text-anchor="middle"> </text>
<polygon points="160,252 100,260 100,280 160,280" fill="#c8c1a8" opacity="0.4"/>
<polygon points="160,283 95,285 95,330 160,330" fill="#e8d99a" opacity="0.35"/>
<polygon points="160,333 140,345 140,415 160,415" fill="#c8c1a8" opacity="0.4"/>

<!-- Track 2: Resistivity -->
<rect x="170" y="60" width="100" height="360" rx="4" fill="#F4F2EC" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="220" y="76" text-anchor="middle" fill="#5F5E5A" font-size="10">Resistivity</text>
<text class="ts" x="220" y="87" text-anchor="middle" fill="#5F5E5A" font-size="9">fluid type</text>
<!-- Resistivity curve: HIGH = oil/gas, LOW = brine/shale -->
<polyline points="185,100 185,148 250,155 255,175 255,200 252,248 185,255 185,280 220,287 222,330 185,335 185,415" fill="none" stroke="#E8593C" stroke-width="1.5"/>
<!-- Oil zone highlight -->
<rect x="170" y="148" width="100" height="100" rx="0" fill="#c08020" opacity="0.12"/>
<text class="ts" x="220" y="200" text-anchor="middle" fill="#854F0B" font-size="9">HIGH = oil</text>

<!-- Track 3: Porosity (NPHI/RHOB) -->
<rect x="280" y="60" width="100" height="360" rx="4" fill="#F4F2EC" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="330" y="76" text-anchor="middle" fill="#5F5E5A" font-size="10">Porosity</text>
<text class="ts" x="330" y="87" text-anchor="middle" fill="#5F5E5A" font-size="9">NPHI + RHOB</text>
<!-- Neutron -->
<polyline points="360,100 360,148 310,160 305,200 308,248 360,255 360,280 325,290 322,330 360,335 360,415" fill="none" stroke="#185FA5" stroke-width="1.2"/>
<!-- Density -->
<polyline points="360,100 360,148 315,158 312,200 314,248 360,255 360,280 330,288 328,330 360,335 360,415" fill="none" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="5 3"/>
<text class="ts" x="310" y="180" fill="#185FA5" font-size="9">NPHI</text>
<text class="ts" x="310" y="220" fill="#7F77DD" font-size="9">RHOB</text>
<!-- Gas crossover -->
<text class="ts" x="330" y="200" text-anchor="middle" fill="#185FA5" font-size="8">crossover</text>
<text class="ts" x="330" y="209" text-anchor="middle" fill="#185FA5" font-size="8">= gas</text>

<!-- Right side: interpretation panel -->
<rect x="395" y="60" width="265" height="360" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="th" x="527" y="82" text-anchor="middle" font-size="12">Formation evaluation output</text>

<!-- Shale zone -->
<rect x="405" y="92" width="245" height="44" rx="4" fill="#c8c1a8" opacity="0.5"/>
<text class="th" x="527" y="111" text-anchor="middle" fill="#2C2C2A" font-size="11">Shale — cap rock</text>
<text class="ts" x="527" y="128" text-anchor="middle" fill="#444441" font-size="10">High GR · Low resistivity · Low porosity</text>

<!-- Oil reservoir zone -->
<rect x="405" y="144" width="245" height="80" rx="4" fill="#c08020" opacity="0.2"/>
<text class="th" x="527" y="163" text-anchor="middle" fill="#633806" font-size="11">Oil-bearing sandstone</text>
<text class="ts" x="415" y="180" font-size="10">• Low GR (clean sand)</text>
<text class="ts" x="415" y="196" font-size="10">• HIGH resistivity (oil is non-conductive)</text>
<text class="ts" x="415" y="212" font-size="10">• Good porosity — 18–22%</text>

<!-- Transition zone -->
<rect x="405" y="232" width="245" height="44" rx="4" fill="#5ba3cc" opacity="0.2"/>
<text class="th" x="527" y="251" text-anchor="middle" fill="#042C53" font-size="11">Transition zone / water leg</text>
<text class="ts" x="527" y="267" text-anchor="middle" fill="#185FA5" font-size="10">Decreasing resistivity toward water</text>

<!-- Secondary sand -->
<rect x="405" y="284" width="245" height="60" rx="4" fill="#e8d99a" opacity="0.4"/>
<text class="th" x="527" y="303" text-anchor="middle" fill="#412402" font-size="11">Secondary sand (wet)</text>
<text class="ts" x="527" y="320" text-anchor="middle" fill="#633806" font-size="10">Low resistivity — water-saturated</text>
<text class="ts" x="527" y="336" text-anchor="middle" fill="#633806" font-size="10">Not productive</text>

<!-- Basement -->
<rect x="405" y="352" width="245" height="58" rx="4" fill="#555048" opacity="0.5"/>
<text class="th" x="527" y="374" text-anchor="middle" fill="#D3D1C7" font-size="11">Basement</text>
<text class="ts" x="527" y="392" text-anchor="middle" fill="#B4B2A9" font-size="10">Dense, non-porous — no porosity</text>

<!-- Legend for log tracks -->
<rect x="30" y="435" width="620" height="48" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="50" y1="455" x2="80" y2="455" stroke="#1D9E75" stroke-width="1.5"/>
<text class="ts" x="86" y="459" font-size="10">Gamma Ray (GR): high=shale/clay, low=clean sand</text>
<line x1="50" y1="472" x2="80" y2="472" stroke="#E8593C" stroke-width="1.5"/>
<text class="ts" x="86" y="476" font-size="10">Resistivity: high=oil or gas, low=brine or shale</text>
<line x1="350" y1="455" x2="380" y2="455" stroke="#185FA5" stroke-width="1.5"/>
<text class="ts" x="386" y="459" font-size="10">Neutron porosity (NPHI)</text>
<line x1="350" y1="472" x2="380" y2="472" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 3"/>
<text class="ts" x="386" y="476" font-size="10">Bulk density (RHOB) — crossover with NPHI = gas</text>
</svg>